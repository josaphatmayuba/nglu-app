services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: nglu_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-nglu_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_USER: ${DB_USERNAME:-nglu_user}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - nglu_network

  # Backend - Laravel API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nglu_backend
    restart: unless-stopped
    working_dir: /app
    env_file:
      - ./backend/.env.docker
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-nglu_db}
      DB_USERNAME: ${DB_USERNAME:-nglu_user}
      DB_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/storage:/app/storage
      - ./backend/bootstrap/cache:/app/bootstrap/cache
    depends_on:
      - mysql
    networks:
      - nglu_network

  # Backend2 - Node.js API for progressive migration
  backend2:
    build:
      context: ./backend2
      dockerfile: Dockerfile
    container_name: nglu_backend2
    restart: unless-stopped
    working_dir: /app
    environment:
      NODE_ENV: development
      PORT: 8001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-nglu_db}
      DB_USERNAME: ${DB_USERNAME:-nglu_user}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      CORS_ORIGIN: http://localhost:3000
      DB_WAIT_RETRIES: 40
      DB_WAIT_DELAY_MS: 1500
    ports:
      - "8001:8001"
    volumes:
      - ./backend2:/app
      - /app/node_modules
    depends_on:
      - mysql
    networks:
      - nglu_network
    command: npm run docker:dev

  # Frontend - React + Vite
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nglu_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      VITE_APP_API: ${VITE_APP_API:-http://localhost:8001}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
      VITE_APP_API_NODE: ${VITE_APP_API_NODE:-http://localhost:8001}
    networks:
      - nglu_network
    command: npm run dev

  # Mailpit - For testing emails
  mailpit:
    image: axllent/mailpit:latest
    container_name: nglu_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - nglu_network

  # phpMyAdmin - MySQL Management Interface
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: nglu_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: ${DB_USERNAME:-nglu_user}
      PMA_PASSWORD: ${DB_PASSWORD:-password}
      PMA_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      PMA_PORT: 3306
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - nglu_network

volumes:
  mysql_data:

networks:
  nglu_network:
    driver: bridge
