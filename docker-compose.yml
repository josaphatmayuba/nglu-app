services:
  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: nglu_mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-nglu_db}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-password}
      MYSQL_USER: ${DB_USERNAME:-nglu_user}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - nglu_network

  # Redis - Realtime Pub/Sub for SSE permission/data updates
  redis:
    image: redis:7-alpine
    container_name: nglu_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - nglu_network

  # Backend - Laravel API (deprecated, historical only).
  # Not started by default. Use:
  # docker compose --profile legacy-laravel up -d backend
  backend:
    profiles:
      - legacy-laravel
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nglu_backend
    restart: unless-stopped
    working_dir: /app
    env_file:
      - ./backend/.env.docker
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-nglu_db}
      DB_USERNAME: ${DB_USERNAME:-nglu_user}
      DB_PASSWORD: ${DB_PASSWORD:-password}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - ./backend/storage:/app/storage
      - ./backend/bootstrap/cache:/app/bootstrap/cache
    depends_on:
      - mysql
    networks:
      - nglu_network

  # Backend2 - Node.js API for progressive migration
  backend2:
    build:
      context: ./backend2
      dockerfile: Dockerfile
    container_name: nglu_backend2
    restart: unless-stopped
    working_dir: /app
    environment:
      NODE_ENV: development
      PORT: 8001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-nglu_db}
      DB_USERNAME: ${DB_USERNAME:-nglu_user}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      CORS_ORIGIN: http://localhost:3000
      APP_URL: http://localhost:3000
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      JWT_SECRET: ${JWT_SECRET:-local_jwt_secret_change_me}
      REFRESH_SECRET: ${REFRESH_SECRET:-local_refresh_secret_change_me}
      PERMISSIONS_GUARD_CACHE_TTL_MS: ${PERMISSIONS_GUARD_CACHE_TTL_MS:-0}
      DB_WAIT_RETRIES: 40
      DB_WAIT_DELAY_MS: 1500
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_CHANNEL_USER_UPDATES: ${REDIS_CHANNEL_USER_UPDATES:-permissions-updates}
      REDIS_CHANNEL_DATA_UPDATES: ${REDIS_CHANNEL_DATA_UPDATES:-data-updates}
      SMTP_HOST: ${SMTP_HOST:-mail.ongdngolu.org}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@ongdngolu.org}
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-true}
      IMAP_HOST: ${IMAP_HOST:-mail.ongdngolu.org}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASS: ${IMAP_PASS:-}
      IMAP_MAILBOX: ${IMAP_MAILBOX:-INBOX}
      IMAP_TLS_REJECT_UNAUTHORIZED: ${IMAP_TLS_REJECT_UNAUTHORIZED:-true}
      STALWART_JMAP_URL: ${STALWART_JMAP_URL:-http://mail.ongdngolu.org:8088/jmap}
      STALWART_ADMIN_USER: ${STALWART_ADMIN_USER:-}
      STALWART_ADMIN_PASS: ${STALWART_ADMIN_PASS:-}
      STALWART_DOMAIN: ${STALWART_DOMAIN:-ongdngolu.org}
    ports:
      - "8001:8001"
    volumes:
      - ./backend2:/app
      - /app/node_modules
    depends_on:
      - mysql
      - redis
    networks:
      - nglu_network
    command: npm run docker:dev

  # Frontend - React + Vite
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: nglu_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules
      # vite.config.js importe ../scripts/app-version.mjs (dossier scripts/ racine du repo).
      # Le mount ./frontend:/app n'inclut pas ce parent -> on le monte explicitement en RO.
      - ./scripts:/scripts:ro
    environment:
      VITE_APP_API: ${VITE_APP_API:-http://localhost:8001}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:8001}
      VITE_APP_API_NODE: ${VITE_APP_API_NODE:-http://localhost:8001}
    networks:
      - nglu_network
    command: npm run dev:local

  # Marketing site - Vue + Vite public website
  # Local URL: http://localhost:3002
  # Production routing remains: ongdngolu.org/ = marketing, ongdngolu.org/crm = CRM.
  marketing-site:
    build:
      context: ./marketing-site
      dockerfile: Dockerfile
    container_name: nglu_marketing_site
    restart: unless-stopped
    ports:
      - "3002:3002"
    volumes:
      - ./marketing-site:/app
      - /app/node_modules
    networks:
      - nglu_network
    command: npm run dev -- --host 0.0.0.0 --port 3002

  # Mailpit - For testing emails
  mailpit:
    image: axllent/mailpit:latest
    container_name: nglu_mailpit
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"
    networks:
      - nglu_network

  # phpMyAdmin - MySQL Management Interface
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: nglu_phpmyadmin
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
      PMA_USER: ${DB_USERNAME:-nglu_user}
      PMA_PASSWORD: ${DB_PASSWORD:-password}
      PMA_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      PMA_PORT: 3306
    ports:
      - "8080:80"
    depends_on:
      - mysql
    networks:
      - nglu_network

volumes:
  mysql_data:

networks:
  nglu_network:
    driver: bridge
