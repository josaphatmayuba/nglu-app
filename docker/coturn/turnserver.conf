# coturn - serveur TURN/STUN pour les appels audio du chat (SCRUM - appels 1-a-1).
#
# Objectif : garantir l'etablissement des appels WebRTC sur les reseaux mobiles
# d'Afrique centrale (Vodacom / Airtel / Orange RDC), ou le NAT symetrique fait
# echouer une part importante des connexions P2P directes.
#
# Le secret d'authentification est injecte au demarrage par docker/coturn/entrypoint.sh
# a partir de la variable d'environnement TURN_SECRET (jamais en dur dans ce fichier).

# --- Ecoute ---------------------------------------------------------------
listening-port=3478
tls-listening-port=5349

# Plage de ports media volontairement etroite : simplifie l'ouverture du
# firewall Lightsail (49160-49200/udp) tout en supportant ~20 appels simultanes.
min-port=49160
max-port=49200

# --- Authentification -----------------------------------------------------
# Credentials ephemeres (RFC 5766 / mecanisme "TURN REST API") : le backend
# genere username=<expiry>:<userId> et credential=base64(HMAC-SHA1(username, secret)).
# Aucun mot de passe statique n'est distribue aux clients.
use-auth-secret
# static-auth-secret est ajoute par l'entrypoint depuis $TURN_SECRET
realm=nglu.chat

# --- Securite -------------------------------------------------------------
# Empeche l'usage du serveur comme relais ouvert vers le reseau interne.
no-multicast-peers
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=::1
denied-peer-ip=fc00::-fdff:ffff:ffff:ffff:ffff:ffff:ffff:ffff
denied-peer-ip=fe80::-febf:ffff:ffff:ffff:ffff:ffff:ffff:ffff

# Verification d'integrite des messages STUN.
fingerprint

# Protocoles obsoletes / inutiles pour WebRTC : desactives.
no-cli
no-tlsv1
no-tlsv1_1

# Limites anti-abus : un appel audio Opus a ~20 kbps consomme tres peu.
# 500 kbps par session laisse une marge confortable et bloque tout detournement
# du relais pour du transfert de fichiers.
max-bps=500000
user-quota=12
total-quota=1200

# --- Logs -----------------------------------------------------------------
# Sortie sur stdout pour que `docker compose logs coturn` fonctionne.
log-file=stdout
simple-log
