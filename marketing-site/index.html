<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ONGD NGOLU — Aide au Développement Durable</title>
  <meta name="description" content="ONGD NGOLU œuvre en RDC pour la souveraineté alimentaire, le soutien aux orphelinats et l'innovation numérique au service du développement durable.">
  <link rel="icon" type="image/png" href="/static/logo.png">

  <!-- Tailwind via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Lucide icons -->
  <script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: {
              50: '#eff6ff', 100: '#dbeafe', 200: '#bfdbfe', 300: '#93c5fd',
              400: '#60a5fa', 500: '#3b82f6', 600: '#1e40af', 700: '#1e3a8a',
              800: '#172554', 900: '#0f172a',
            },
            accent: {
              500: '#f59e0b', 600: '#d97706',
            },
            growth: {
              500: '#16a34a', 600: '#15803d',
            },
          },
          fontFamily: {
            sans: ['Inter', 'system-ui', 'sans-serif'],
            display: ['Playfair Display', 'serif'],
          },
        }
      }
    }
  </script>

  <style>
    html { scroll-behavior: smooth; }
    body { font-family: 'Inter', sans-serif; }

    /* Hero gradient overlay */
    .hero-gradient {
      background:
        radial-gradient(ellipse at top right, rgba(245, 158, 11, 0.15) 0%, transparent 50%),
        radial-gradient(ellipse at bottom left, rgba(22, 163, 74, 0.15) 0%, transparent 50%),
        linear-gradient(135deg, #0f172a 0%, #1e3a8a 60%, #1e40af 100%);
    }

    /* Subtle pattern */
    .pattern-bg {
      background-image: radial-gradient(circle, rgba(30, 58, 138, 0.05) 1px, transparent 1px);
      background-size: 24px 24px;
    }

    /* Fade-in on scroll */
    .fade-in {
      opacity: 0;
      transform: translateY(20px);
      transition: opacity 0.7s ease-out, transform 0.7s ease-out;
    }
    .fade-in.visible {
      opacity: 1;
      transform: translateY(0);
    }

    /* Pillar card hover */
    .pillar-card {
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .pillar-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 20px 40px -10px rgba(30, 58, 138, 0.2);
    }

    /* Smooth gradient on tech section */
    .tech-bg {
      background: linear-gradient(135deg, #f8fafc 0%, #eff6ff 100%);
    }

    /* Donate button pulse */
    @keyframes subtle-pulse {
      0%, 100% { box-shadow: 0 4px 14px rgba(245, 158, 11, 0.3); }
      50%     { box-shadow: 0 6px 22px rgba(245, 158, 11, 0.5); }
    }
    .donate-btn { animation: subtle-pulse 2.5s ease-in-out infinite; }

    /* Mobile menu */
    .nav-link {
      position: relative;
      transition: color 0.2s;
    }
    .nav-link::after {
      content: '';
      position: absolute;
      bottom: -6px;
      left: 0;
      width: 0;
      height: 2px;
      background: #f59e0b;
      transition: width 0.3s;
    }
    .nav-link:hover::after { width: 100%; }
  </style>
</head>
<body class="bg-white text-slate-800 antialiased">
  <div id="app"></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
