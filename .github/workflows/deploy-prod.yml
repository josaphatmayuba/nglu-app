name: Deploy prod

# Traduction de bitbucket-pipelines.yml (branche master -> prod).
#   master -> ongdngolu.org (16.54.167.125) + avelomi.com (3.128.45.29)
# Les apps statiques sont buildees UNE fois puis deployees vers les 2 prods
# (aucune variable VITE specifique par serveur, contrairement au frontend).
# Le deploy Avelomi est tolerant : s'il echoue, le deploy ongdngolu deja
# reussi n'est pas remis en cause.
#
# environment: production -> ajoute une gate d'approbation GitHub si tu la
# configures dans Settings > Environments (recommande pour la prod).

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      deploy_all:
        description: Tout redeployer en ignorant les filtres de chemins
        type: boolean
        default: false

concurrency:
  group: deploy-prod
  cancel-in-progress: false

env:
  ONGD_SERVER: admin@16.54.167.125
  AVELOMI_SERVER: admin@3.128.45.29
  APP: /opt/nglu-app

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend2: ${{ steps.decide.outputs.backend2 }}
      middleware: ${{ steps.decide.outputs.middleware }}
      frontend: ${{ steps.decide.outputs.frontend }}
      domus: ${{ steps.decide.outputs.domus }}
      journal: ${{ steps.decide.outputs.journal }}
      tickets: ${{ steps.decide.outputs.tickets }}
      farmos: ${{ steps.decide.outputs.farmos }}
      batipro: ${{ steps.decide.outputs.batipro }}
      hr: ${{ steps.decide.outputs.hr }}
      comptabilite: ${{ steps.decide.outputs.comptabilite }}
      migration: ${{ steps.decide.outputs.migration }}
      chat: ${{ steps.decide.outputs.chat }}
      marketing: ${{ steps.decide.outputs.marketing }}
      avelomi_site: ${{ steps.decide.outputs.avelomi_site }}
      # Matrice des apps statiques reduite aux seules apps modifiees, pour que
      # le workflow n'affiche pas de jobs vides (parite avec les
      # changesets.includePaths de Bitbucket).
      static_matrix: ${{ steps.decide.outputs.static_matrix }}
      static_any: ${{ steps.decide.outputs.static_any }}
    steps:
      # fetch-depth: 0 obligatoire ici : paths-filter compare deux commits et
      # echoue sur un clone shallow ("fatal: shallow file has changed since we
      # read it"). Les autres jobs gardent le checkout shallow par defaut.
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # NB: pas d'ancre YAML ici — paths-filter reparse ce bloc et une ancre
          # produirait une liste imbriquee qu'il refuse. Chemins explicites.
          # Sans base explicite, paths-filter cherche le merge-base avec `main`
          # (son defaut interne) : ce repo n'a pas de branche `main` (master/develop
          # seulement) -> "No merge base found" -> comparaison directe qui marque
          # TOUT comme modifie.
          base: HEAD^
          filters: |
            backend2:
              - 'backend2/**'
              - 'docker-compose.prod.yml'
              - 'scripts/ci/ensure-shared-minio.sh'
            middleware:
              - 'middleware/**'
              - 'docker-compose.prod.yml'
            frontend:
              - 'frontend/**'
              - 'scripts/ci/deploy-prod-static-app.sh'
              - 'frontend/Dockerfile.prod'
              - 'docker-compose.prod.yml'
              - 'nginx/nginx.frontend.conf'
              - 'nginx/nginx.avelomi.conf'
            domus:
              - 'domus-app/**'
              - 'scripts/ci/deploy-prod-static-app.sh'
              - 'frontend/Dockerfile.prod'
              - 'docker-compose.prod.yml'
              - 'nginx/nginx.frontend.conf'
              - 'nginx/nginx.avelomi.conf'
            journal:
              - 'journal-app/**'
              - 'scripts/ci/deploy-prod-static-app.sh'
              - 'frontend/Dockerfile.prod'
              - 'docker-compose.prod.yml'
              - 'nginx/nginx.frontend.conf'
              - 'nginx/nginx.avelomi.conf'
            tickets:
              - 'tickets-app/**'
              - 'scripts/ci/deploy-prod-static-app.sh'
              - 'frontend/Dockerfile.prod'
              - 'docker-compose.prod.yml'
              - 'nginx/nginx.frontend.conf'
              - 'nginx/nginx.avelomi.conf'
            farmos:
              - 'farmos-app/**'
              - 'scripts/ci/deploy-prod-static-app.sh'
              - 'frontend/Dockerfile.prod'
              - 'docker-compose.prod.yml'
              - 'nginx/nginx.frontend.conf'
              - 'nginx/nginx.avelomi.conf'
            batipro:
              - 'batipro-app/**'
              - 'scripts/ci/deploy-prod-static-app.sh'
              - 'frontend/Dockerfile.prod'
              - 'docker-compose.prod.yml'
              - 'nginx/nginx.frontend.conf'
              - 'nginx/nginx.avelomi.conf'
            hr:
              - 'hr-app/**'
              - 'scripts/ci/deploy-prod-static-app.sh'
              - 'frontend/Dockerfile.prod'
              - 'docker-compose.prod.yml'
              - 'nginx/nginx.frontend.conf'
              - 'nginx/nginx.avelomi.conf'
            comptabilite:
              - 'comptabilite-app/**'
              - 'scripts/ci/deploy-prod-static-app.sh'
              - 'frontend/Dockerfile.prod'
              - 'docker-compose.prod.yml'
              - 'nginx/nginx.frontend.conf'
              - 'nginx/nginx.avelomi.conf'
            migration:
              - 'migration-app/**'
              - 'scripts/ci/deploy-prod-static-app.sh'
              - 'frontend/Dockerfile.prod'
              - 'docker-compose.prod.yml'
              - 'nginx/nginx.frontend.conf'
              - 'nginx/nginx.avelomi.conf'
            chat:
              - 'chat-app/**'
              - 'scripts/ci/deploy-prod-static-app.sh'
              - 'frontend/Dockerfile.prod'
              - 'docker-compose.prod.yml'
              - 'nginx/nginx.frontend.conf'
              - 'nginx/nginx.avelomi.conf'
            marketing:
              - 'marketing-site/**'
              - 'scripts/ci/deploy-prod-static-app.sh'
              - 'frontend/Dockerfile.prod'
              - 'nginx/nginx.frontend.conf'
            avelomi_site:
              - 'avelomi-site/**'
              - 'scripts/ci/deploy-prod-static-app.sh'
              - 'frontend/Dockerfile.prod'
              - 'nginx/nginx.avelomi.conf'
      - id: decide
        env:
          ALL: ${{ inputs.deploy_all }}
          FILTER: ${{ toJSON(steps.filter.outputs) }}
        run: |
          set -euo pipefail
          for k in backend2 middleware frontend domus journal tickets farmos \
                   batipro hr comptabilite migration chat marketing avelomi_site; do
            if [ "$ALL" = "true" ]; then
              echo "$k=true" >> "$GITHUB_OUTPUT"
              eval "flag_$k=true"
            else
              v=$(printf '%s' "$FILTER" | jq -r --arg k "$k" '.[$k] // "false"')
              echo "$k=$v" >> "$GITHUB_OUTPUT"
              eval "flag_$k=$v"
            fi
          done

          # Definition des apps statiques (source unique : le job static-prod
          # consomme cette matrice au lieu de la redeclarer).
          all_static='[
            {"app":"domus-app",        "flag":"domus",        "base":"/domus/",        "build":"build"},
            {"app":"journal-app",      "flag":"journal",      "base":"/journal/",      "build":"build"},
            {"app":"tickets-app",      "flag":"tickets",      "base":"/tickets/",      "build":"build"},
            {"app":"farmos-app",       "flag":"farmos",       "base":"/farmos/",       "build":"build"},
            {"app":"batipro-app",      "flag":"batipro",      "base":"/batipro/",      "build":"build"},
            {"app":"hr-app",           "flag":"hr",           "base":"/hr/",           "build":"build"},
            {"app":"comptabilite-app", "flag":"comptabilite", "base":"/comptabilite/", "build":"build:prod"},
            {"app":"migration-app",    "flag":"migration",    "base":"/migration/",    "build":"build"},
            {"app":"chat-app",         "flag":"chat",         "base":"/chat/",         "build":"build:prod"}
          ]'

          # Ne garde que les apps dont le flag vaut true.
          selected='[]'
          for row in $(printf '%s' "$all_static" | jq -c '.[]'); do
            f=$(printf '%s' "$row" | jq -r '.flag')
            eval "v=\${flag_$f}"
            if [ "$v" = "true" ]; then
              selected=$(printf '%s' "$selected" | jq -c --argjson r "$row" '. + [$r]')
            fi
          done

          count=$(printf '%s' "$selected" | jq 'length')
          echo "static_matrix=$(printf '%s' "$selected" | jq -c '{include: .}')" >> "$GITHUB_OUTPUT"
          if [ "$count" -gt 0 ]; then
            echo "static_any=true" >> "$GITHUB_OUTPUT"
          else
            echo "static_any=false" >> "$GITHUB_OUTPUT"
          fi

  # ───────────────────────────── Backend2 → prod ─────────────────────────────
  backend2-prod:
    needs: changes
    if: needs.changes.outputs.backend2 == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: backend2/package-lock.json }
      - uses: ./.github/actions/ssh-setup
        with: { key: '${{ secrets.SSH_PRIVATE_KEY }}', name: ongdngolu }
      - run: cd backend2 && npm ci && npm audit --audit-level=critical && npm run build
      - name: Deploy
        env:
          SERVER: ${{ env.ONGD_SERVER }}
        run: |
          set -euo pipefail
          $SSH $SERVER "cd $APP && (git pull origin master || echo '[deploy] git pull ignore')"
          $SCP -r backend2/dist $SERVER:$APP/backend2/
          # Sync package.json AVANT le --build (COPY package*.json + npm ci dans le
          # Dockerfile) : sinon toute nouvelle dep manque -> MODULE_NOT_FOUND.
          $SCP backend2/package.json backend2/package-lock.json $SERVER:$APP/backend2/
          $SCP backend2/Dockerfile backend2/Dockerfile.prod $SERVER:$APP/backend2/
          $SCP -r backend2/drizzle $SERVER:$APP/backend2/
          $SCP docker-compose.prod.yml $SERVER:$APP/
          $SSH $SERVER "cd $APP && docker compose -p nglu_prod -f docker-compose.prod.yml --env-file .env.prod up -d --build --no-deps backend2"
          $SCP scripts/ci/ensure-shared-minio.sh $SERVER:$APP/
          $SSH $SERVER "cd $APP && sh ensure-shared-minio.sh nglu_prod_backend2"
          $SSH $SERVER "cd $APP && docker compose -p nglu_prod -f docker-compose.prod.yml ps"

  middleware-prod:
    needs: changes
    if: needs.changes.outputs.middleware == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ssh-setup
        with: { key: '${{ secrets.SSH_PRIVATE_KEY }}', name: ongdngolu }
      - name: Deploy
        env:
          SERVER: ${{ env.ONGD_SERVER }}
        run: |
          set -euo pipefail
          $SSH $SERVER "cd $APP && (git pull origin master || echo '[deploy] git pull ignore')"
          $SCP -r middleware $SERVER:$APP/
          $SSH $SERVER "cd $APP && docker compose -p nglu_prod -f docker-compose.prod.yml --env-file .env.prod up -d --build --no-deps middleware"
          $SSH $SERVER "cd $APP && docker compose -p nglu_prod -f docker-compose.prod.yml ps"

  # ────────── Apps statiques → prod : build UNE fois, 2 serveurs ──────────
  static-prod:
    needs: changes
    runs-on: ubuntu-latest
    environment: production
    # Matrice calculee par le job `changes` : elle ne contient QUE les apps
    # modifiees, donc plus aucun job vide n'apparait dans le workflow. Le garde
    # par etape (`steps.gate`) devient inutile : un job present est un job a faire.
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.static_matrix) }}
    if: needs.changes.outputs.static_any == 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: ./.github/actions/ssh-setup
        with: { key: '${{ secrets.SSH_PRIVATE_KEY }}', name: ongdngolu }
      - uses: ./.github/actions/ssh-setup
        with: { key: '${{ secrets.AVELOMI_SSH_KEY }}', name: avelomi }
      - name: Build (une fois pour les 2 prods)
        run: cd ${{ matrix.app }} && npm install --legacy-peer-deps && npm run ${{ matrix.build }}
      - name: Deploy ongdngolu (bloquant)
        env:
          SERVER: ${{ env.ONGD_SERVER }}
          BASE_URL: https://ongdngolu.org
          SUPPORT_CONF: nginx/nginx.frontend.conf
          SSH: ssh -i ~/.ssh/ongdngolu.pem -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=20
          SCP: scp -i ~/.ssh/ongdngolu.pem -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=20
        run: sh scripts/ci/deploy-prod-static-app.sh ${{ matrix.app }} ${{ matrix.base }}
      - name: Deploy Avelomi (tolerant)
        env:
          SERVER: ${{ env.AVELOMI_SERVER }}
          BASE_URL: https://avelomi.com
          SUPPORT_CONF: nginx/nginx.avelomi.conf
          SSH: ssh -i ~/.ssh/avelomi.pem -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=2
          SCP: scp -i ~/.ssh/avelomi.pem -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=20
        run: sh scripts/ci/deploy-prod-static-app.sh ${{ matrix.app }} ${{ matrix.base }} || echo "[deploy] Avelomi skip/echec tolere"

  # Frontend : builds SEPARES (API differente par serveur), donc 2 jobs distincts.
  frontend-prod:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: ./.github/actions/ssh-setup
        with: { key: '${{ secrets.SSH_PRIVATE_KEY }}', name: ongdngolu }
      - run: cd frontend && npm install --legacy-peer-deps && (npm audit --audit-level=high || true) && npm run build:prod
      - name: Deploy
        env:
          SERVER: ${{ env.ONGD_SERVER }}
          SSH: ssh -i ~/.ssh/ongdngolu.pem -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=20
          SCP: scp -i ~/.ssh/ongdngolu.pem -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=20
        run: sh scripts/ci/deploy-prod-static-app.sh frontend /crm

  marketing-prod:
    needs: changes
    if: needs.changes.outputs.marketing == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: ./.github/actions/ssh-setup
        with: { key: '${{ secrets.SSH_PRIVATE_KEY }}', name: ongdngolu }
      - run: cd marketing-site && npm install --legacy-peer-deps && npm run build
      - name: Deploy
        env:
          SERVER: ${{ env.ONGD_SERVER }}
          SSH: ssh -i ~/.ssh/ongdngolu.pem -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=20
          SCP: scp -i ~/.ssh/ongdngolu.pem -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=20
        run: sh scripts/ci/deploy-prod-static-app.sh marketing-site /

  # ──────────────────────── Serveur Avelomi (2e prod) ────────────────────────
  backend2-avelomi-prod:
    needs: changes
    if: needs.changes.outputs.backend2 == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: npm, cache-dependency-path: backend2/package-lock.json }
      - uses: ./.github/actions/ssh-setup
        with: { key: '${{ secrets.AVELOMI_SSH_KEY }}', name: avelomi }
      - run: cd backend2 && npm ci && npm audit --audit-level=critical && npm run build
      - name: Deploy
        env:
          SERVER: ${{ env.AVELOMI_SERVER }}
          AVELOMI_DB_PASSWORD: ${{ secrets.AVELOMI_DB_PASSWORD }}
        run: |
          set -euo pipefail
          # .env.prod genere sur le serveur s'il est absent/vide. DB_PASSWORD vient du
          # secret (mdp user MySQL 'avelomi'), JWT/REFRESH generes par openssl SUR LE
          # SERVEUR : jamais en clair dans le repo ni dans les logs du runner.
          if [ -z "${AVELOMI_DB_PASSWORD:-}" ]; then
            echo "[deploy] AVELOMI_DB_PASSWORD non defini - .env.prod non genere."
          else
            $SSH $SERVER "DBPW='$AVELOMI_DB_PASSWORD' bash -s" <<'ENVGEN'
          set -e
          mkdir -p /opt/nglu-app 2>/dev/null || sudo -n mkdir -p /opt/nglu-app
          [ -w /opt/nglu-app ] || sudo -n chown "$(id -un):$(id -gn)" /opt/nglu-app
          f=/opt/nglu-app/.env.prod
          if [ ! -s "$f" ]; then
            printf "APP_URL=https://avelomi.com\nCORS_ORIGIN=https://avelomi.com\nFRONTEND_URL=https://avelomi.com/crm\nDB_HOST=35.169.124.49\nDB_PORT=9306\nDB_DATABASE=avelomi_db\nDB_USERNAME=avelomi\nDB_PASSWORD=%s\nDB_ROOT_PASSWORD=\nDB_WAIT_RETRIES=40\nDB_WAIT_DELAY_MS=1500\nJWT_SECRET=%s\nREFRESH_SECRET=%s\nREDIS_ENABLED=true\nREDIS_HOST=redis\nREDIS_PORT=6379\nREDIS_CHANNEL_DATA_UPDATES=data-updates\nREDIS_CHANNEL_USER_UPDATES=user-updates\nPERMISSIONS_GUARD_CACHE_TTL_MS=60000\nRENT_REMINDERS_ENABLED=false\nVITE_API_URL=https://avelomi.com/api\nVITE_APP_API=https://avelomi.com/api\nVITE_APP_API_NODE=https://avelomi.com/api\n" \
              "$DBPW" "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" > "$f"
            chmod 600 "$f"
            echo "[deploy] .env.prod Avelomi genere."
          else echo "[deploy] .env.prod Avelomi deja rempli - inchange"; fi
          ENVGEN
          fi
          # Garde : skip propre tant que .env.prod n'est pas rempli (sans lui, pas de config DB).
          if ! $SSH $SERVER 'test -s /opt/nglu-app/.env.prod'; then
            echo "[deploy] Avelomi prod pas pret : .env.prod absent/vide. Job ignore."
            exit 0
          fi
          # Pas de clone git sur Avelomi : on scp tout l'artefact necessaire.
          $SSH $SERVER "set -e; mkdir -p $APP/backend2 2>/dev/null || sudo -n mkdir -p $APP/backend2; if [ ! -w $APP ] || [ ! -w $APP/backend2 ]; then sudo -n chown \$(id -un):\$(id -gn) $APP && sudo -n chown -R \$(id -un):\$(id -gn) $APP/backend2; fi"
          $SCP -r backend2/dist $SERVER:$APP/backend2/
          $SCP backend2/package.json backend2/package-lock.json $SERVER:$APP/backend2/
          $SCP backend2/Dockerfile backend2/Dockerfile.prod $SERVER:$APP/backend2/
          $SCP -r backend2/drizzle $SERVER:$APP/backend2/
          $SCP docker-compose.prod.yml $SERVER:$APP/docker-compose.prod.yml
          $SSH $SERVER "cd $APP && D=docker; docker ps >/dev/null 2>&1 || D='sudo -n docker'; \$D compose -p nglu_prod -f docker-compose.prod.yml --env-file .env.prod up -d --build --no-deps backend2"
          $SCP scripts/ci/ensure-shared-minio.sh $SERVER:$APP/
          $SSH $SERVER "cd $APP && sh ensure-shared-minio.sh nglu_prod_backend2"
          $SSH $SERVER "cd $APP && D=docker; docker ps >/dev/null 2>&1 || D='sudo -n docker'; \$D compose -p nglu_prod -f docker-compose.prod.yml ps"

  middleware-avelomi-prod:
    needs: changes
    if: needs.changes.outputs.middleware == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ssh-setup
        with: { key: '${{ secrets.AVELOMI_SSH_KEY }}', name: avelomi }
      - name: Deploy
        env:
          SERVER: ${{ env.AVELOMI_SERVER }}
        run: |
          set -euo pipefail
          if ! $SSH $SERVER 'test -s /opt/nglu-app/.env.prod'; then
            echo "[deploy] Avelomi prod pas pret : .env.prod absent/vide. Job ignore."
            exit 0
          fi
          $SSH $SERVER "set -e; mkdir -p $APP/middleware 2>/dev/null || sudo -n mkdir -p $APP/middleware; if [ ! -w $APP ] || [ ! -w $APP/middleware ]; then sudo -n chown \$(id -un):\$(id -gn) $APP && sudo -n chown -R \$(id -un):\$(id -gn) $APP/middleware; fi"
          $SCP -r middleware $SERVER:$APP/
          $SCP docker-compose.prod.yml $SERVER:$APP/docker-compose.prod.yml
          $SSH $SERVER "cd $APP && D=docker; docker ps >/dev/null 2>&1 || D='sudo -n docker'; \$D compose -p nglu_prod -f docker-compose.prod.yml --env-file .env.prod up -d --build --no-deps middleware"
          $SSH $SERVER "cd $APP && D=docker; docker ps >/dev/null 2>&1 || D='sudo -n docker'; \$D compose -p nglu_prod -f docker-compose.prod.yml ps"

  # Frontend Avelomi : build separe (VITE_* pointent avelomi.com + signup active).
  frontend-avelomi-prod:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: ./.github/actions/ssh-setup
        with: { key: '${{ secrets.AVELOMI_SSH_KEY }}', name: avelomi }
      - name: Build
        # Vite lit ces VITE_* au build (priorite sur .env.production qui code
        # ongdngolu en dur). VITE_SIGNUP_ENABLED : inscription self-service Avelomi.
        env:
          VITE_APP_API: https://avelomi.com/api
          VITE_API_URL: https://avelomi.com/api
          VITE_APP_API_NODE: https://avelomi.com/api
          VITE_SIGNUP_ENABLED: 'true'
        run: cd frontend && npm install --legacy-peer-deps && (npm audit --audit-level=high || true) && npm run build:prod
      - name: Deploy
        env:
          SERVER: ${{ env.AVELOMI_SERVER }}
          BASE_URL: https://avelomi.com
          SUPPORT_CONF: nginx/nginx.avelomi.conf
        run: sh scripts/ci/deploy-prod-static-app.sh frontend /crm

  avelomi-site-prod:
    needs: changes
    if: needs.changes.outputs.avelomi_site == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20' }
      - uses: ./.github/actions/ssh-setup
        with: { key: '${{ secrets.AVELOMI_SSH_KEY }}', name: avelomi }
      - run: cd avelomi-site && npm install --legacy-peer-deps && npm run build
      - name: Deploy
        env:
          SERVER: ${{ env.AVELOMI_SERVER }}
          BASE_URL: https://avelomi.com
          SUPPORT_CONF: nginx/nginx.avelomi.conf
        run: sh scripts/ci/deploy-prod-static-app.sh avelomi-site /
