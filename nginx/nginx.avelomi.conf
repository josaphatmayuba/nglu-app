# ════════════════════════════════════════════════════════════════════
# Avelomi nginx config — avelomi.com production + dev.avelomi.com
# Mounted from host /opt/nglu-app/nginx/nginx.frontend.conf on the Avelomi
# server (3.128.45.29). Avelomi is a SEPARATE stack: same prod roots
# (html-*-prod), same prod middleware (nglu_prod_middleware), plus a static
# dev landing mounted from /opt/nglu-app-dev/avelomi-site/dist.
#
# This file is the Avelomi counterpart of nginx.frontend.conf (which is
# dual-domain ongdngolu.org + dev.ongdngolu.org and stays on the ongdngolu
# server only). Keep the prod routing contract in sync between the two.
# Reload after edits: docker exec nglu_prod_frontend nginx -s reload
# ════════════════════════════════════════════════════════════════════

# Path traversal map
map $request_uri $is_path_traversal {
    "~*(\.\.)|(%2e%2e)|(%252e)|(%c0%ae)" 1;
    default 0;
}

# ─── HTTP → HTTPS redirect ──────────────────────────────────────────
server {
    listen 80;
    server_name avelomi.com www.avelomi.com dev.avelomi.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ════════════════════════════════════════════════════════════════════
# PRODUCTION: avelomi.com
#
# Routing contract (identical to ongdngolu prod):
# - https://avelomi.com/      serves marketing-site
# - https://avelomi.com/crm   is the canonical CRM entry point
# - /admin/* and /assets/*    are reserved for the CRM SPA build
# - /api/*                    proxies to middleware/backend
# ════════════════════════════════════════════════════════════════════
server {
    listen 443 ssl;
    server_name avelomi.com www.avelomi.com;
    client_max_body_size 10m;

    ssl_certificate     /etc/letsencrypt/live/avelomi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avelomi.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend http://nglu_prod_middleware:3001;

    if ($is_path_traversal) { return 403; }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://unpkg.com https://cdn.dribbble.com https://*.tile.openstreetmap.org; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests;" always;
    error_page 413 = @prod_payload_too_large;

    # Default root = Avelomi product landing (vitrine SaaS). The CRM must not
    # be served at /. This is what makes avelomi.com's home page differ from
    # ongdngolu's ONG landing (html-marketing-prod), same image, different root.
    root /usr/share/nginx/html-avelomi-prod;
    index index.html;

    # SSE streams must bypass nginx response buffering.
    location /api/events/ {
        client_max_body_size 10m;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        client_max_body_size 10m;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    # CRM public entry point. The React router still owns /admin/* internally.
    location = /crm        { return 302 /admin/auth/login; }
    location = /crm/       { return 302 /admin/auth/login; }

    # CRM SPA at /admin/*.
    location ^~ /admin {
        root /usr/share/nginx/html;
        try_files $uri $uri/ @prod_erp_spa;
    }

    # Public-facing CRM routes (shared links: /sign/:token, /onboarding/...).
    location ^~ /sign/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ @prod_erp_spa;
    }
    location ^~ /onboarding/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ @prod_erp_spa;
    }

    location @prod_erp_spa {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location @prod_payload_too_large {
        default_type application/json;
        return 413 '{"statusCode":413,"message":"Uploaded file is too large. Maximum size is 10 MB.","error":"Payload Too Large"}';
    }

    # CRM build chunks are emitted as absolute /assets/* paths by Vite.
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Legacy CRM public images (avoid img onError retry loops).
    location ~* ^/images/(default\.jpg|man\.png)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* ^/(favicon\.ico|favicon-.*\.png|apple-touch-icon.*\.png|android-chrome-.*\.png|site\.webmanifest)$ {
        root /usr/share/nginx/html;
    }

    # Old marketing alias.
    location = /site  { return 301 /; }
    location = /site/ { return 301 /; }

    # ── FarmOS SPA at /farmos/* ──
    location = /farmos { return 301 /farmos/; }
    location ^~ /farmos/farmos-assets/ {
        alias /usr/share/nginx/html-farmos-prod/farmos-assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /farmos/styles/ {
        alias /usr/share/nginx/html-farmos-prod/styles/;
    }
    location ^~ /farmos/ {
        alias /usr/share/nginx/html-farmos-prod/;
        try_files $uri $uri/ @prod_farmos_spa;
    }
    location @prod_farmos_spa {
        root /usr/share/nginx/html-farmos-prod;
        try_files /index.html =404;
    }

    # ── BatiPro SPA at /batipro/* ──
    location = /batipro { return 301 /batipro/; }
    location ^~ /batipro/batipro-assets/ {
        alias /usr/share/nginx/html-batipro-prod/batipro-assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /batipro/ {
        alias /usr/share/nginx/html-batipro-prod/;
        try_files $uri $uri/ @prod_batipro_spa;
    }
    location @prod_batipro_spa {
        root /usr/share/nginx/html-batipro-prod;
        try_files /index.html =404;
    }

    # ── HR SPA at /hr/* ──
    location = /hr { return 301 /hr/; }
    location ^~ /hr/hr-assets/ {
        alias /usr/share/nginx/html-hr-prod/hr-assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /hr/ {
        alias /usr/share/nginx/html-hr-prod/;
        try_files $uri $uri/ @prod_hr_spa;
    }
    location @prod_hr_spa {
        root /usr/share/nginx/html-hr-prod;
        try_files /index.html =404;
    }

    # ── Comptabilite SPA at /comptabilite/* ──
    location = /comptabilite { return 301 /comptabilite/; }
    location ^~ /comptabilite/comptabilite-assets/ {
        alias /usr/share/nginx/html-comptabilite-prod/comptabilite-assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /comptabilite/ {
        alias /usr/share/nginx/html-comptabilite-prod/;
        try_files $uri $uri/ @prod_comptabilite_spa;
    }
    location @prod_comptabilite_spa {
        root /usr/share/nginx/html-comptabilite-prod;
        try_files /index.html =404;
    }

    # ── Domus SPA at /domus/* ──
    location = /domus { return 301 /domus/; }
    location ^~ /domus/domus-assets/ {
        alias /usr/share/nginx/html-domus-prod/domus-assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /domus/ {
        alias /usr/share/nginx/html-domus-prod/;
        try_files $uri $uri/ @prod_domus_spa;
    }
    location @prod_domus_spa {
        root /usr/share/nginx/html-domus-prod;
        try_files /index.html =404;
    }

    # ── Journal Entreprise SPA at /journal/* ──
    location = /journal { return 301 /journal/; }
    location ^~ /journal/journal-assets/ {
        alias /usr/share/nginx/html-journal-prod/journal-assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /journal/ {
        alias /usr/share/nginx/html-journal-prod/;
        try_files $uri $uri/ @prod_journal_spa;
    }
    location @prod_journal_spa {
        root /usr/share/nginx/html-journal-prod;
        try_files /index.html =404;
    }

    # ── Tickets SPA at /tickets/* ──
    location = /tickets { return 301 /tickets/; }
    location ^~ /tickets/tickets-assets/ {
        alias /usr/share/nginx/html-tickets-prod/tickets-assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /tickets/ {
        alias /usr/share/nginx/html-tickets-prod/;
        try_files $uri $uri/ @prod_tickets_spa;
    }
    location @prod_tickets_spa {
        root /usr/share/nginx/html-tickets-prod;
        try_files /index.html =404;
    }

    # ── Chat SPA at /chat/* ──
    location = /chat { return 301 /chat/; }
    location ^~ /chat/chat-assets/ {
        alias /usr/share/nginx/html-chat-prod/chat-assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /chat/ {
        alias /usr/share/nginx/html-chat-prod/;
        try_files $uri $uri/ @prod_chat_spa;
    }
    location @prod_chat_spa {
        root /usr/share/nginx/html-chat-prod;
        try_files /index.html =404;
    }

    # ── Migration Cockpit SPA at /migration/* ──
    location = /migration { return 301 /migration/; }
    location ^~ /migration/migration-assets/ {
        alias /usr/share/nginx/html-migration-prod/migration-assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /migration/ {
        alias /usr/share/nginx/html-migration-prod/;
        try_files $uri $uri/ @prod_migration_spa;
    }
    location @prod_migration_spa {
        root /usr/share/nginx/html-migration-prod;
        try_files /index.html =404;
    }

    # Marketing site catch-all.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;
}

# ════════════════════════════════════════════════════════════════════
# DEVELOPMENT: dev.avelomi.com
#
# Static Avelomi product landing built from develop. It is deployed to the
# Avelomi server, not the ongdngolu dev server.
# ════════════════════════════════════════════════════════════════════
server {
    listen 443 ssl;
    server_name dev.avelomi.com;
    client_max_body_size 10m;

    # scripts/provision-avelomi.sh issues/expands this cert with dev.avelomi.com
    # as a SAN, so prod and dev Avelomi share one cert lineage.
    ssl_certificate     /etc/letsencrypt/live/avelomi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avelomi.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    if ($is_path_traversal) { return 403; }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header X-Environment "development" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://unpkg.com https://cdn.dribbble.com https://*.tile.openstreetmap.org; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests;" always;

    root /usr/share/nginx/html-avelomi-dev;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;
}
