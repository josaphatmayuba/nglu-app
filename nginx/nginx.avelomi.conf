# Les gens tapent naturellement hr.avelomi.com (app hr-app, chemin /hr) et
# comptabilite.avelomi.com (chemin /comptabilite) : on les redirige vers les
# noms canoniques courts. Les 4 alias sont dans le cert avelomi-wildcard.
server {
    listen 443 ssl;
    server_name hr.avelomi.com;
    ssl_certificate     /etc/letsencrypt/live/avelomi-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avelomi-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3; ssl_ciphers HIGH:!aNULL:!MD5;
    return 301 https://rh.avelomi.com$request_uri;
}
server {
    listen 443 ssl;
    server_name hr.dev.avelomi.com;
    ssl_certificate     /etc/letsencrypt/live/avelomi-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avelomi-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3; ssl_ciphers HIGH:!aNULL:!MD5;
    return 301 https://rh.dev.avelomi.com$request_uri;
}
server {
    listen 443 ssl;
    server_name comptabilite.avelomi.com;
    ssl_certificate     /etc/letsencrypt/live/avelomi-wildcard/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/avelomi-wildcard/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3; ssl_ciphers HIGH:!aNULL:!MD5;
    return 301 https://compta.avelomi.com$request_uri;
}
