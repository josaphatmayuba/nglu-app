}

# ════════════════════════════════════════════════════════════════════
# ALLO DOCTA: allodocta.avelomi.com (HTTPS)
#
# Application séparée (repo Allo-Docta/allo-docta-app) déployée sur ce
# serveur dans /opt/allo-docta. Ses containers (allodocta_frontend,
# allodocta_backend) rejoignent le réseau externe nglu_shared pour être
# joignables depuis ce nginx. La BD Postgres reste sur un réseau interne
# à sa stack, non exposée ici.
#
# Certificat Let's Encrypt DÉDIÉ (allodocta.avelomi.com), volontairement
# séparé de la lignée avelomi.com pour ne pas toucher au cert de prod nglu.
# ════════════════════════════════════════════════════════════════════
server {
    listen 80;
    server_name allodocta.avelomi.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name allodocta.avelomi.com;
    client_max_body_size 10m;

    ssl_certificate     /etc/letsencrypt/live/allodocta.avelomi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/allodocta.avelomi.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $allodocta_front http://allodocta_frontend:80;
    set $allodocta_back http://allodocta_backend:5000;

    if ($is_path_traversal) { return 403; }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    location /api/ {
        proxy_pass $allodocta_back;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location /socket.io/ {
        proxy_pass $allodocta_back;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
    }

    # Signalisation WebRTC des consultations video Allo Docta.
    # Timeout long : la socket reste ouverte pendant toute la consultation.
    location /ws {
        proxy_pass $allodocta_back;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass $allodocta_front;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;
}
