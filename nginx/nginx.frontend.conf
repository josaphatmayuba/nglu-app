        try_files /index.html =404;
    }

    # ── Chat SPA at /chat/* (Vite build, base=/chat/) ──
    location = /chat { return 301 /chat/; }
    location ^~ /chat/chat-assets/ {
        alias /usr/share/nginx/html-chat-dev/chat-assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /chat/manifest.webmanifest {
        alias /usr/share/nginx/html-chat-dev/manifest.webmanifest;
        default_type application/manifest+json;
    }
    location ^~ /chat/ {
        alias /usr/share/nginx/html-chat-dev/;
        try_files $uri $uri/ @dev_chat_spa;
    }
    location @dev_chat_spa {
        root /usr/share/nginx/html-chat-dev;
        try_files /index.html =404;
    }

    # ── Migration Cockpit SPA at /migration/* (Vite build, base=/migration/) ──
    location = /migration { return 301 /migration/; }
    location ^~ /migration/migration-assets/ {
        alias /usr/share/nginx/html-migration-dev/migration-assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /migration/ {
        alias /usr/share/nginx/html-migration-dev/;
        try_files $uri $uri/ @dev_migration_spa;
    }
    location @dev_migration_spa {
        root /usr/share/nginx/html-migration-dev;
        try_files /index.html =404;
    }

    # ── Marketing site (catch-all root) ───────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;
}
