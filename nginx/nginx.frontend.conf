# ════════════════════════════════════════════════════════════════════
# Dual-domain nginx config: ongdngolu.org (prod) + dev.ongdngolu.org
# Mounted from host /opt/nglu-app/nginx/nginx.frontend.conf
# Reload after edits: docker exec nglu_prod_frontend nginx -s reload
# ════════════════════════════════════════════════════════════════════

# Path traversal map (shared by both server blocks)
map $request_uri $is_path_traversal {
    "~*(\.\.)|(%2e%2e)|(%252e)|(%c0%ae)" 1;
    default 0;
}

# ─── HTTP → HTTPS redirect (both domains) ───────────────────────────
server {
    listen 80;
    server_name ongdngolu.org dev.ongdngolu.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ════════════════════════════════════════════════════════════════════
# PRODUCTION: ongdngolu.org
# ════════════════════════════════════════════════════════════════════
server {
    listen 443 ssl;
    server_name ongdngolu.org;
    client_max_body_size 10m;

    ssl_certificate     /etc/letsencrypt/live/ongdngolu.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ongdngolu.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend http://nglu_prod_middleware:3001;

    if ($is_path_traversal) { return 403; }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    error_page 413 = @prod_payload_too_large;

    # Default root = built Vue marketing site. The CRM must not be served at /.
    root /usr/share/nginx/html-marketing-prod;
    index index.html;

    location /api/ {
        client_max_body_size 10m;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    # CRM public entry point. The React router still owns /admin/* internally.
    location = /crm        { return 302 /admin/auth/login; }
    location = /crm/       { return 302 /admin/auth/login; }

    # CRM SPA at /admin/*.
    location ^~ /admin {
        root /usr/share/nginx/html;
        try_files $uri $uri/ @prod_erp_spa;
    }

    # Public-facing CRM routes (shared links).
    location ^~ /sign/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ @prod_erp_spa;
    }
    location ^~ /onboarding/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ @prod_erp_spa;
    }

    location @prod_erp_spa {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location @prod_payload_too_large {
        default_type application/json;
        return 413 '{"statusCode":413,"message":"Uploaded file is too large. Maximum size is 10 MB.","error":"Payload Too Large"}';
    }

    # CRM build chunks are emitted as absolute /assets/* paths by Vite.
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* ^/(favicon\.ico|favicon-.*\.png|apple-touch-icon.*\.png|android-chrome-.*\.png|site\.webmanifest)$ {
        root /usr/share/nginx/html;
    }

    # Old marketing alias kept for links that may still exist.
    location = /site  { return 301 /; }
    location = /site/ { return 301 /; }

    # Marketing site catch-all.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;
}

# ════════════════════════════════════════════════════════════════════
# DEVELOPMENT: dev.ongdngolu.org
# ════════════════════════════════════════════════════════════════════
server {
    listen 443 ssl;
    server_name dev.ongdngolu.org;
    client_max_body_size 10m;

    ssl_certificate     /etc/letsencrypt/live/dev.ongdngolu.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.ongdngolu.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend http://nglu_dev_middleware:3001;

    if ($is_path_traversal) { return 403; }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Environment "development" always;
    error_page 413 = @dev_payload_too_large;

    # Default root = built Vue marketing site (root path serves the landing page)
    root /usr/share/nginx/html-marketing-dev;
    index index.html;

    # ── API → middleware ──────────────────────────────────────
    location /api/ {
        client_max_body_size 10m;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    # ── /crm shortcut → ERP login page ────────────────────────
    location = /crm        { return 302 /admin/auth/login; }
    location = /crm/       { return 302 /admin/auth/login; }

    # ── ERP SPA at /admin/* (React Router handles internal routes) ──
    # try_files fallback uses a named location so the internal redirect
    # doesn't re-match `location /` (which would serve the marketing site).
    location ^~ /admin {
        root /usr/share/nginx/html-dev;
        try_files $uri $uri/ @erp_spa;
    }

    # Public-facing CRM routes (shared links). Same fallback as /admin.
    location ^~ /sign/ {
        root /usr/share/nginx/html-dev;
        try_files $uri $uri/ @erp_spa;
    }
    location ^~ /onboarding/ {
        root /usr/share/nginx/html-dev;
        try_files $uri $uri/ @erp_spa;
    }

    location @erp_spa {
        root /usr/share/nginx/html-dev;
        try_files /index.html =404;
    }

    location @dev_payload_too_large {
        default_type application/json;
        return 413 '{"statusCode":413,"message":"Uploaded file is too large. Maximum size is 10 MB.","error":"Payload Too Large"}';
    }

    # ── ERP build assets (JS/CSS chunks) ──────────────────────
    location ^~ /assets/ {
        root /usr/share/nginx/html-dev;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── ERP favicons / manifests etc. ─────────────────────────
    location ~* ^/(favicon\.ico|favicon-.*\.png|apple-touch-icon.*\.png|android-chrome-.*\.png|site\.webmanifest)$ {
        root /usr/share/nginx/html-dev;
    }

    # ── /site/ alias (kept for backward compat) ───────────────
    location = /site  { return 301 /; }
    location = /site/ { return 301 /; }

    # ── Marketing site (catch-all root) ───────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;
}
