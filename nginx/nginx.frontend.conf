    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend http://nglu_dev_middleware:3001;

    if ($is_path_traversal) { return 403; }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    add_header X-Environment "development" always;
    # SCRUM-230: même CSP que prod.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://unpkg.com https://cdn.dribbble.com https://*.tile.openstreetmap.org; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests;" always;
    error_page 413 = @dev_payload_too_large;

    # Default root = built Vue marketing site (root path serves the landing page)
    root /usr/share/nginx/html-marketing-dev;
    index index.html;

    # SSE streams must bypass nginx response buffering.
    location /api/events/ {
        client_max_body_size 10m;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # ── API → middleware ──────────────────────────────────────
    # Socket.IO (chat realtime + calls) uses /socket.io as transport path and
    # /chat as namespace. Keep this outside /api so browser clients can upgrade.
    location /socket.io/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        client_max_body_size 10m;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    # ── /crm shortcut → ERP login page ────────────────────────
    location = /crm        { return 302 /admin/auth/login; }
    location = /crm/       { return 302 /admin/auth/login; }

    # ── ERP SPA at /admin/* (React Router handles internal routes) ──
    # try_files fallback uses a named location so the internal redirect
    # doesn't re-match `location /` (which would serve the marketing site).
    location ^~ /admin {
        root /usr/share/nginx/html-dev;
        try_files $uri $uri/ @erp_spa;
    }

    # Public-facing CRM routes (shared links). Same fallback as /admin.
    location ^~ /sign/ {
        root /usr/share/nginx/html-dev;
        try_files $uri $uri/ @erp_spa;
    }
    location ^~ /onboarding/ {
        root /usr/share/nginx/html-dev;
        try_files $uri $uri/ @erp_spa;
    }

    location @erp_spa {
        root /usr/share/nginx/html-dev;
        try_files /index.html =404;
    }

    location @dev_payload_too_large {
        default_type application/json;
        return 413 '{"statusCode":413,"message":"Uploaded file is too large. Maximum size is 10 MB.","error":"Payload Too Large"}';
    }

    # ── ERP build assets (JS/CSS chunks) ──────────────────────
    location ^~ /assets/ {
        root /usr/share/nginx/html-dev;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Legacy CRM public images (see the production server block above).
    location ~* ^/images/(default\.jpg|man\.png)$ {
        root /usr/share/nginx/html-dev;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ── ERP favicons / manifests etc. ─────────────────────────
    location ~* ^/(favicon\.ico|favicon-.*\.png|apple-touch-icon.*\.png|android-chrome-.*\.png|site\.webmanifest)$ {
        root /usr/share/nginx/html-dev;
    }

    # ── /site/ alias (kept for backward compat) ───────────────
    location = /site  { return 301 /; }
    location = /site/ { return 301 /; }

    # ── FarmOS SPA at /farmos/* (Vite build, base=/farmos/) ──
    location = /farmos { return 301 /farmos/; }
    location ^~ /farmos/farmos-assets/ {
        alias /usr/share/nginx/html-farmos-dev/farmos-assets/;
