# ════════════════════════════════════════════════════════════════════
# Dual-domain nginx config: ongdngolu.org (prod) + dev.ongdngolu.org
# Mounted from host /opt/nglu-app/nginx/nginx.frontend.conf
# (Route /migration/ ajoutée — appliquée in-place via docker cp, cf. pipeline.)
# Reload after edits: docker exec nglu_prod_frontend nginx -s reload
# ════════════════════════════════════════════════════════════════════

# Path traversal map (shared by both server blocks)
map $request_uri $is_path_traversal {
    "~*(\.\.)|(%2e%2e)|(%252e)|(%c0%ae)" 1;
    default 0;
}

# nginx's default mime.types has no entry for .mjs (ES module JS), so it was
# served as application/octet-stream — some mobile browsers reject a static
# `import` inside an AudioWorklet module when the MIME type isn't JS-like
# (cf. chat-app/src/ultra/codec2.js loaded from codec2-worklet.js).
types {
    application/javascript mjs;
}

# ─── HTTP → HTTPS redirect (both domains) ───────────────────────────
server {
    listen 80;
    server_name ongdngolu.org dev.ongdngolu.org;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ════════════════════════════════════════════════════════════════════
# PRODUCTION: ongdngolu.org
#
# Routing contract - do not change without updating PRODUCTION_ROUTING.md,
# DEPLOY.md, docker-compose.prod.yml and marketing-site/README.md:
# - https://ongdngolu.org/      serves marketing-site
# - https://ongdngolu.org/crm   is the canonical CRM entry point
# - /admin/* and /assets/*      are reserved for the CRM SPA build
# - /api/*                      proxies to middleware/backend
# Validation: node scripts/check-routing-contract.mjs
# ════════════════════════════════════════════════════════════════════
server {
    listen 443 ssl;
    server_name ongdngolu.org;
    client_max_body_size 10m;

    ssl_certificate     /etc/letsencrypt/live/ongdngolu.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ongdngolu.org/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend http://nglu_prod_middleware:3001;

    if ($is_path_traversal) { return 403; }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(self), geolocation=()" always;
    # SCRUM-230: CSP durcie. Tailwind est buildé localement (SCRUM-68); unpkg/dribbble
    # restent autorisés pour les images Leaflet et le 404. Pas de script externe.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://unpkg.com https://cdn.dribbble.com https://*.tile.openstreetmap.org; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests;" always;
    error_page 413 = @prod_payload_too_large;

    # Default root = built Vue marketing site. The CRM must not be served at /.
    root /usr/share/nginx/html-marketing-prod;
    index index.html;

    # SSE streams must bypass nginx response buffering.
    location /api/events/ {
        client_max_body_size 10m;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }

    # Socket.IO (chat realtime + calls) uses /socket.io as transport path and
    # /chat as namespace. Keep this outside /api so browser clients can upgrade.
    location /socket.io/ {
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_buffering off;
        proxy_read_timeout 1h;
    }

    location /api/ {
        client_max_body_size 10m;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    # CRM public entry point. The React router still owns /admin/* internally.
    location = /crm        { return 302 /admin/auth/login; }
    location = /crm/       { return 302 /admin/auth/login; }

    # CRM SPA at /admin/*.
    location ^~ /admin {
        root /usr/share/nginx/html;
        try_files $uri $uri/ @prod_erp_spa;
    }

    # Public-facing CRM routes (no /admin prefix because they're shared
    # links: tenants click /sign/:token from email, candidates open
    # /onboarding/tenant?token=...). Must route to the CRM SPA, not the
    # marketing site.
    location ^~ /sign/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ @prod_erp_spa;
    }
    location ^~ /onboarding/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ @prod_erp_spa;
    }

    location @prod_erp_spa {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }

    location @prod_payload_too_large {
        default_type application/json;
        return 413 '{"statusCode":413,"message":"Uploaded file is too large. Maximum size is 10 MB.","error":"Payload Too Large"}';
    }

    # CRM build chunks are emitted as absolute /assets/* paths by Vite.
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Legacy CRM public images. Without this location they fall through to the
    # marketing SPA and are returned as text/html, which can create img onError
    # retry loops in the React application.
    location ~* ^/images/(default\.jpg|man\.png)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location ~* ^/(favicon\.ico|favicon-.*\.png|apple-touch-icon.*\.png|android-chrome-.*\.png|site\.webmanifest)$ {
        root /usr/share/nginx/html;
    }

    # Old marketing alias kept for links that may still exist.
    location = /site  { return 301 /; }
    location = /site/ { return 301 /; }

    # ── FarmOS SPA at /farmos/* (Vite build, base=/farmos/) ──
    location = /farmos { return 301 /farmos/; }
    location ^~ /farmos/farmos-assets/ {
        alias /usr/share/nginx/html-farmos-prod/farmos-assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /farmos/styles/ {
        alias /usr/share/nginx/html-farmos-prod/styles/;
    }
    location ^~ /farmos/ {
        alias /usr/share/nginx/html-farmos-prod/;
        try_files $uri $uri/ @prod_farmos_spa;
    }
    location @prod_farmos_spa {
        root /usr/share/nginx/html-farmos-prod;
        try_files /index.html =404;
    }

    # ── BatiPro SPA at /batipro/* (Vite build, base=/batipro/) ──
    location = /batipro { return 301 /batipro/; }
    location ^~ /batipro/batipro-assets/ {
        alias /usr/share/nginx/html-batipro-prod/batipro-assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /batipro/ {
        alias /usr/share/nginx/html-batipro-prod/;
        try_files $uri $uri/ @prod_batipro_spa;
    }
    location @prod_batipro_spa {
        root /usr/share/nginx/html-batipro-prod;
        try_files /index.html =404;
    }

    # ── HR SPA at /hr/* (Vite build, base=/hr/) ──
    location = /hr { return 301 /hr/; }
    location ^~ /hr/hr-assets/ {
        alias /usr/share/nginx/html-hr-prod/hr-assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /hr/ {
        alias /usr/share/nginx/html-hr-prod/;
        try_files $uri $uri/ @prod_hr_spa;
    }
    location @prod_hr_spa {
        root /usr/share/nginx/html-hr-prod;
        try_files /index.html =404;
    }

    # ── Comptabilite SPA at /comptabilite/* (Vite build, base=/comptabilite/) ──
    location = /comptabilite { return 301 /comptabilite/; }
    location ^~ /comptabilite/comptabilite-assets/ {
        alias /usr/share/nginx/html-comptabilite-prod/comptabilite-assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /comptabilite/ {
        alias /usr/share/nginx/html-comptabilite-prod/;
        try_files $uri $uri/ @prod_comptabilite_spa;
    }
    location @prod_comptabilite_spa {
        root /usr/share/nginx/html-comptabilite-prod;
        try_files /index.html =404;
    }

    # ── Domus SPA at /domus/* (Vite build, base=/domus/) ──
    location = /domus { return 301 /domus/; }
    location ^~ /domus/domus-assets/ {
        alias /usr/share/nginx/html-domus-prod/domus-assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /domus/ {
        alias /usr/share/nginx/html-domus-prod/;
        try_files $uri $uri/ @prod_domus_spa;
    }
    location @prod_domus_spa {
        root /usr/share/nginx/html-domus-prod;
        try_files /index.html =404;
    }

    # ── Journal Entreprise SPA at /journal/* (Vite build, base=/journal/) ──
    location = /journal { return 301 /journal/; }
    location ^~ /journal/journal-assets/ {
        alias /usr/share/nginx/html-journal-prod/journal-assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /journal/ {
        alias /usr/share/nginx/html-journal-prod/;
        try_files $uri $uri/ @prod_journal_spa;
    }
    location @prod_journal_spa {
        root /usr/share/nginx/html-journal-prod;
        try_files /index.html =404;
    }

    # ── Tickets SPA at /tickets/* (Vite build, base=/tickets/) ──
    location = /tickets { return 301 /tickets/; }
    location ^~ /tickets/tickets-assets/ {
        alias /usr/share/nginx/html-tickets-prod/tickets-assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /tickets/ {
        alias /usr/share/nginx/html-tickets-prod/;
        try_files $uri $uri/ @prod_tickets_spa;
    }
    location @prod_tickets_spa {
        root /usr/share/nginx/html-tickets-prod;
        try_files /index.html =404;
    }

    # ── Chat SPA at /chat/* (Vite build, base=/chat/) ──
    location = /chat { return 301 /chat/; }
    location ^~ /chat/chat-assets/ {
        alias /usr/share/nginx/html-chat-prod/chat-assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location = /chat/manifest.webmanifest {
        alias /usr/share/nginx/html-chat-prod/manifest.webmanifest;
        default_type application/manifest+json;
    }
    location ^~ /chat/ {
        alias /usr/share/nginx/html-chat-prod/;
        try_files $uri $uri/ @prod_chat_spa;
    }
    location @prod_chat_spa {
        root /usr/share/nginx/html-chat-prod;
        try_files /index.html =404;
    }

    # ── Migration Cockpit SPA at /migration/* (Vite build, base=/migration/) ──
    location = /migration { return 301 /migration/; }
    location ^~ /migration/migration-assets/ {
        alias /usr/share/nginx/html-migration-prod/migration-assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /migration/ {
        alias /usr/share/nginx/html-migration-prod/;
        try_files $uri $uri/ @prod_migration_spa;
    }
    location @prod_migration_spa {
        root /usr/share/nginx/html-migration-prod;
        try_files /index.html =404;
    }

    # Marketing site catch-all.
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;
}

