# Avelomi development nginx config.
# Mounted as /etc/nginx/conf.d/default.conf on the Avelomi server for
# develop deployments. It serves dev.avelomi.com: the Vue landing + the
# native Avelomi auth pages (#/login, #/signup) which call the SHARED
# backend through /api (proxied to the prod middleware). No ERP SPA here.

map $request_uri $is_path_traversal {
    "~*(\.\.)|(%2e%2e)|(%252e)|(%c0%ae)" 1;
    default 0;
}

server {
    listen 80;
    server_name dev.avelomi.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name dev.avelomi.com;
    client_max_body_size 10m;

    ssl_certificate     /etc/letsencrypt/live/dev.avelomi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.avelomi.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    if ($is_path_traversal) { return 403; }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header X-Environment "development" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://unpkg.com https://cdn.dribbble.com https://*.tile.openstreetmap.org; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests;" always;

    resolver 127.0.0.11 valid=30s ipv6=off;
    # dev.avelomi.com tape le stack DEV isole (docker-compose.dev.yml, projet
    # nglu_dev) deploye sur ce meme serveur Avelomi via le bloc develop du
    # pipeline. Joignable car nglu_dev_middleware est sur le reseau nglu_shared,
    # comme nglu_prod_frontend qui porte ce nginx. Le prod Avelomi reste sur
    # nglu_prod_middleware (nginx.avelomi.conf), non touche.
    set $backend http://nglu_dev_middleware:3001;

    root /usr/share/nginx/html-avelomi-dev;
    index index.html;

    # Shared backend: the native Avelomi auth pages POST to /api/auth/login
    # and /api/auth/register (same middleware/backend as the ERP).
    location /api/events/ {
        client_max_body_size 10m;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
    location /api/ {
        client_max_body_size 10m;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    # Avelomi landing + hash-routed auth pages (SPA fallback to index.html).
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;
}
