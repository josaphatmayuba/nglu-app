# Avelomi development nginx config.
# Mounted as /etc/nginx/conf.d/default.conf on the Avelomi server for
# develop deployments. It serves only dev.avelomi.com.

map $request_uri $is_path_traversal {
    "~*(\.\.)|(%2e%2e)|(%252e)|(%c0%ae)" 1;
    default 0;
}

server {
    listen 80;
    server_name dev.avelomi.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    server_name dev.avelomi.com;
    client_max_body_size 10m;

    ssl_certificate     /etc/letsencrypt/live/dev.avelomi.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.avelomi.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    if ($is_path_traversal) { return 403; }

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;
    add_header X-Environment "development" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https://unpkg.com https://cdn.dribbble.com https://*.tile.openstreetmap.org; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'; upgrade-insecure-requests;" always;

    resolver 127.0.0.11 valid=30s ipv6=off;
    set $backend http://nglu_prod_middleware:3001;

    root /usr/share/nginx/html-avelomi-dev;
    index index.html;

    # ── ERP/CRM routing (mirrors avelomi.com prod) ──
    # Same nginx container as avelomi.com prod, so the shared CRM root
    # (/usr/share/nginx/html) and html-*-prod roots are available here.
    location /api/events/ {
        client_max_body_size 10m;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 1h;
    }
    location /api/ {
        client_max_body_size 10m;
        rewrite ^/api/(.*) /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host;
    }

    location = /crm  { return 302 /admin/auth/login; }
    location = /crm/ { return 302 /admin/auth/login; }

    location ^~ /admin {
        root /usr/share/nginx/html;
        try_files $uri $uri/ @dev_erp_spa;
    }
    location ^~ /sign/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ @dev_erp_spa;
    }
    location ^~ /onboarding/ {
        root /usr/share/nginx/html;
        try_files $uri $uri/ @dev_erp_spa;
    }
    location @dev_erp_spa {
        root /usr/share/nginx/html;
        try_files /index.html =404;
    }
    location ^~ /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~* ^/images/(default\.jpg|man\.png)$ {
        root /usr/share/nginx/html;
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~* ^/(favicon\.ico|favicon-.*\.png|apple-touch-icon.*\.png|android-chrome-.*\.png|site\.webmanifest)$ {
        root /usr/share/nginx/html;
    }

    # ── Module SPAs (mirror of avelomi.com prod) ──
    location = /farmos { return 301 /farmos/; }
    location ^~ /farmos/farmos-assets/ {
        alias /usr/share/nginx/html-farmos-prod/farmos-assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /farmos/styles/ {
        alias /usr/share/nginx/html-farmos-prod/styles/;
    }
    location ^~ /farmos/ {
        alias /usr/share/nginx/html-farmos-prod/;
        try_files $uri $uri/ @dev_farmos_spa;
    }
    location @dev_farmos_spa {
        root /usr/share/nginx/html-farmos-prod;
        try_files /index.html =404;
    }

    location = /batipro { return 301 /batipro/; }
    location ^~ /batipro/batipro-assets/ {
        alias /usr/share/nginx/html-batipro-prod/batipro-assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /batipro/ {
        alias /usr/share/nginx/html-batipro-prod/;
        try_files $uri $uri/ @dev_batipro_spa;
    }
    location @dev_batipro_spa {
        root /usr/share/nginx/html-batipro-prod;
        try_files /index.html =404;
    }

    location = /hr { return 301 /hr/; }
    location ^~ /hr/hr-assets/ {
        alias /usr/share/nginx/html-hr-prod/hr-assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /hr/ {
        alias /usr/share/nginx/html-hr-prod/;
        try_files $uri $uri/ @dev_hr_spa;
    }
    location @dev_hr_spa {
        root /usr/share/nginx/html-hr-prod;
        try_files /index.html =404;
    }

    location = /comptabilite { return 301 /comptabilite/; }
    location ^~ /comptabilite/comptabilite-assets/ {
        alias /usr/share/nginx/html-comptabilite-prod/comptabilite-assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /comptabilite/ {
        alias /usr/share/nginx/html-comptabilite-prod/;
        try_files $uri $uri/ @dev_comptabilite_spa;
    }
    location @dev_comptabilite_spa {
        root /usr/share/nginx/html-comptabilite-prod;
        try_files /index.html =404;
    }

    location = /domus { return 301 /domus/; }
    location ^~ /domus/domus-assets/ {
        alias /usr/share/nginx/html-domus-prod/domus-assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /domus/ {
        alias /usr/share/nginx/html-domus-prod/;
        try_files $uri $uri/ @dev_domus_spa;
    }
    location @dev_domus_spa {
        root /usr/share/nginx/html-domus-prod;
        try_files /index.html =404;
    }

    location = /journal { return 301 /journal/; }
    location ^~ /journal/journal-assets/ {
        alias /usr/share/nginx/html-journal-prod/journal-assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /journal/ {
        alias /usr/share/nginx/html-journal-prod/;
        try_files $uri $uri/ @dev_journal_spa;
    }
    location @dev_journal_spa {
        root /usr/share/nginx/html-journal-prod;
        try_files /index.html =404;
    }

    location = /tickets { return 301 /tickets/; }
    location ^~ /tickets/tickets-assets/ {
        alias /usr/share/nginx/html-tickets-prod/tickets-assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /tickets/ {
        alias /usr/share/nginx/html-tickets-prod/;
        try_files $uri $uri/ @dev_tickets_spa;
    }
    location @dev_tickets_spa {
        root /usr/share/nginx/html-tickets-prod;
        try_files /index.html =404;
    }

    location = /chat { return 301 /chat/; }
    location ^~ /chat/chat-assets/ {
        alias /usr/share/nginx/html-chat-prod/chat-assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /chat/ {
        alias /usr/share/nginx/html-chat-prod/;
        try_files $uri $uri/ @dev_chat_spa;
    }
    location @dev_chat_spa {
        root /usr/share/nginx/html-chat-prod;
        try_files /index.html =404;
    }

    location = /migration { return 301 /migration/; }
    location ^~ /migration/migration-assets/ {
        alias /usr/share/nginx/html-migration-prod/migration-assets/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ^~ /migration/ {
        alias /usr/share/nginx/html-migration-prod/;
        try_files $uri $uri/ @dev_migration_spa;
    }
    location @dev_migration_spa {
        root /usr/share/nginx/html-migration-prod;
        try_files /index.html =404;
    }

    # Marketing/landing catch-all (Avelomi dev vitrine).
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml text/javascript;
    gzip_min_length 1000;
}
