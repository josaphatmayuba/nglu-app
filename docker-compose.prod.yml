# Production stack
# Deployed to /opt/nglu-app/ on Lightsail
# Launch: docker compose -p nglu_prod -f docker-compose.prod.yml --env-file .env.prod up -d

services:
  backend2:
    build:
      context: ./backend2
      dockerfile: Dockerfile.prod
    container_name: nglu_prod_backend2
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8001
      DB_HOST: ${DB_HOST:-35.169.124.49}
      DB_PORT: ${DB_PORT:-9306}
      DB_DATABASE: ${DB_DATABASE:-nglu_db}
      DB_USERNAME: ${DB_USERNAME:-nglu_user}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://ongdngolu.org}
      APP_URL: ${APP_URL:-https://ongdngolu.org}
      # Production routing contract: marketing lives at /, CRM entrypoint is /crm.
      # Keep PRODUCTION_ROUTING.md, DEPLOY.md, nginx config and marketing README in sync.
      FRONTEND_URL: ${FRONTEND_URL:-https://ongdngolu.org/crm}
      DB_WAIT_RETRIES: 40
      DB_WAIT_DELAY_MS: 1500
      JWT_SECRET: ${JWT_SECRET:-changeme_in_prod}
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_HOST: ${REDIS_HOST:-}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_CHANNEL_USER_UPDATES: ${REDIS_CHANNEL_USER_UPDATES:-user-updates}
      REDIS_CHANNEL_DATA_UPDATES: ${REDIS_CHANNEL_DATA_UPDATES:-data-updates}
      SMTP_HOST: ${SMTP_HOST:-mail.ongdngolu.org}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@ongdngolu.org}
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-true}
      IMAP_HOST: ${IMAP_HOST:-mail.ongdngolu.org}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASS: ${IMAP_PASS:-}
      IMAP_MAILBOX: ${IMAP_MAILBOX:-INBOX}
      IMAP_TLS_REJECT_UNAUTHORIZED: ${IMAP_TLS_REJECT_UNAUTHORIZED:-true}
    networks:
      - nglu_prod_network
    mem_limit: 180m

  middleware:
    build:
      context: ./middleware
      dockerfile: Dockerfile
    container_name: nglu_prod_middleware
    restart: unless-stopped
    environment:
      PORT: 3001
      BACKEND_URL: http://backend2:8001
      JWT_SECRET: ${JWT_SECRET:-changeme_in_prod}
    depends_on:
      - backend2
    networks:
      - nglu_prod_network
      - nglu_shared
    mem_limit: 48m

  frontend:
    build:
      # Build context = repo root so the image can bake BOTH the CRM
      # (frontend/dist) AND the marketing site (marketing-site/dist).
      context: .
      dockerfile: frontend/Dockerfile.prod
    container_name: nglu_prod_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Bind mount certbot webroot from host (so host certbot --webroot works)
      - /var/www/certbot:/var/www/certbot
      # Dual-domain nginx config mounted from host (no rebuild needed for routing changes)
      - ./nginx/nginx.frontend.conf:/etc/nginx/conf.d/default.conf:ro
      # Prod CRM (frontend/dist) and prod marketing are baked into the image.
      # Dev assets remain bind-mounted because they come from a sibling repo
      # (/opt/nglu-app-dev/) and follow the develop branch independently.
      - /opt/nglu-app-dev/frontend/dist:/usr/share/nginx/html-dev:ro
      - /opt/nglu-app-dev/marketing-site/dist:/usr/share/nginx/html-marketing-dev:ro
    depends_on:
      - middleware
    networks:
      - nglu_prod_network
      - nglu_shared
    mem_limit: 48m

# No named volumes — certbot uses bind mount /var/www/certbot

networks:
  nglu_prod_network:
    name: nglu_prod_network
    driver: bridge
  nglu_shared:
    external: true
