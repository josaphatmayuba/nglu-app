services:
  backend2:
    build:
      context: ./backend2
      dockerfile: Dockerfile.prod
    container_name: nglu_backend2
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8001
      DB_HOST: ${DB_HOST:-35.169.124.49}
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-nglu_db}
      DB_USERNAME: ${DB_USERNAME:-nglu_user}
      DB_PASSWORD: ${DB_PASSWORD:-password}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://ongdngolu.org}
      FRONTEND_URL: ${FRONTEND_URL:-https://ongdngolu.org}
      DB_WAIT_RETRIES: 40
      DB_WAIT_DELAY_MS: 1500
      JWT_SECRET: ${JWT_SECRET:-changeme_in_prod}
    networks:
      - nglu_network
    mem_limit: 200m

  middleware:
    build:
      context: ./middleware
      dockerfile: Dockerfile
    container_name: nglu_middleware
    restart: unless-stopped
    environment:
      PORT: 3001
      BACKEND_URL: http://backend2:8001
      JWT_SECRET: ${JWT_SECRET:-changeme_in_prod}
    depends_on:
      - backend2
    networks:
      - nglu_network
    mem_limit: 64m

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    container_name: nglu_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      - certbot_webroot:/var/www/certbot
    depends_on:
      - middleware
    networks:
      - nglu_network
    mem_limit: 32m

volumes:
  certbot_webroot:

networks:
  nglu_network:
    driver: bridge
