# Production stack
# Deployed to /opt/nglu-app/ on Lightsail
# Launch: docker compose -p nglu_prod -f docker-compose.prod.yml --env-file .env.prod up -d

services:
  redis:
    image: redis:7-alpine
    container_name: nglu_prod_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no", "--requirepass", "${REDIS_PASSWORD}"]
    networks:
      - nglu_prod_network
    mem_limit: 64m
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: nglu_prod_minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nglu_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-change_me_minio_password_32_chars_minimum}
    volumes:
      - nglu_prod_minio_data:/data
    networks:
      - nglu_prod_network
    mem_limit: 192m

  backend2:
    build:
      context: ./backend2
      dockerfile: Dockerfile.prod
    container_name: nglu_prod_backend2
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 8001
      DB_HOST: ${DB_HOST:-35.169.124.49}
      DB_PORT: ${DB_PORT:-9306}
      DB_DATABASE: ${DB_DATABASE:-nglu_db}
      DB_USERNAME: ${DB_USERNAME:-nglu_user}
      DB_PASSWORD: ${DB_PASSWORD:-}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://ongdngolu.org}
      APP_URL: ${APP_URL:-https://ongdngolu.org}
      # Production routing contract: marketing lives at /, CRM entrypoint is /crm.
      # Keep PRODUCTION_ROUTING.md, DEPLOY.md, nginx config and marketing README in sync.
      FRONTEND_URL: ${FRONTEND_URL:-https://ongdngolu.org/crm}
      DB_WAIT_RETRIES: 40
      DB_WAIT_DELAY_MS: 1500
      JWT_SECRET: ${JWT_SECRET:-}
      # Optional only for backward compatibility: backend2 falls back to a strong
      # JWT_SECRET when REFRESH_SECRET is missing. Set a dedicated value in prod.
      REFRESH_SECRET: ${REFRESH_SECRET:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      PERMISSIONS_GUARD_CACHE_TTL_MS: ${PERMISSIONS_GUARD_CACHE_TTL_MS:-0}
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_CHANNEL_USER_UPDATES: ${REDIS_CHANNEL_USER_UPDATES:-permissions-updates}
      REDIS_CHANNEL_DATA_UPDATES: ${REDIS_CHANNEL_DATA_UPDATES:-data-updates}
      SMTP_HOST: ${SMTP_HOST:-mail.ongdngolu.org}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-noreply@ongdngolu.org}
      SMTP_TLS_REJECT_UNAUTHORIZED: ${SMTP_TLS_REJECT_UNAUTHORIZED:-true}
      IMAP_HOST: ${IMAP_HOST:-mail.ongdngolu.org}
      IMAP_PORT: ${IMAP_PORT:-993}
      IMAP_USER: ${IMAP_USER:-}
      IMAP_PASS: ${IMAP_PASS:-}
      IMAP_MAILBOX: ${IMAP_MAILBOX:-INBOX}
      IMAP_TLS_REJECT_UNAUTHORIZED: ${IMAP_TLS_REJECT_UNAUTHORIZED:-true}
      # Internal-only Stalwart admin/JMAP endpoint. Never point this at public mail.ongdngolu.org:8088.
      STALWART_JMAP_URL: ${STALWART_JMAP_URL:-}
      STALWART_ADMIN_USER: ${STALWART_ADMIN_USER:-}
      STALWART_ADMIN_PASS: ${STALWART_ADMIN_PASS:-}
      STALWART_DOMAIN: ${STALWART_DOMAIN:-ongdngolu.org}
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_HOST: ${TURN_HOST:-}
      TURN_PORT: ${TURN_PORT:-3478}
      TURN_TLS_PORT: ${TURN_TLS_PORT:-5349}
      TURN_REALM: ${TURN_REALM:-nglu.chat}
      TURN_CREDENTIAL_TTL: ${TURN_CREDENTIAL_TTL:-3600}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
      RENT_REMINDERS_ENABLED: ${RENT_REMINDERS_ENABLED:-false}
      RENT_REMINDER_OVERDUE_DAYS: ${RENT_REMINDER_OVERDUE_DAYS:-15}
      RENT_REMINDER_CRON: ${RENT_REMINDER_CRON:-0 9 * * *}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-http://minio:9000}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:-nglu_minio}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-change_me_minio_password_32_chars_minimum}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-nglu-files}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_FORCE_PATH_STYLE: ${OBJECT_STORAGE_FORCE_PATH_STYLE:-true}
    networks:
      - nglu_prod_network
    mem_limit: 180m
    depends_on:
      redis:
        condition: service_healthy
      minio:
        condition: service_started

  middleware:
    build:
      context: ./middleware
      dockerfile: Dockerfile
    container_name: nglu_prod_middleware
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      BACKEND_URL: http://backend2:8001
      JWT_SECRET: ${JWT_SECRET:-}
    depends_on:
      - backend2
    networks:
      - nglu_prod_network
      - nglu_shared
    mem_limit: 48m

  frontend:
    build:
      # Build context = repo root so the image can bake BOTH the CRM
      # (frontend/dist) AND the marketing site (marketing-site/dist).
      context: .
      dockerfile: frontend/Dockerfile.prod
    container_name: nglu_prod_frontend
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # Bind mount certbot webroot from host (so host certbot --webroot works)
      - /var/www/certbot:/var/www/certbot
      # Dual-domain nginx config mounted from host (no rebuild needed for routing changes)
      - ./nginx/nginx.frontend.conf:/etc/nginx/conf.d/default.conf:ro
      # Prod CRM (frontend/dist) and prod marketing are baked into the image.
      # Dev assets remain bind-mounted because they come from a sibling repo
      # (/opt/nglu-app-dev/) and follow the develop branch independently.
      - /opt/nglu-app-dev/frontend/dist:/usr/share/nginx/html-dev:ro
      - /opt/nglu-app-dev/marketing-site/dist:/usr/share/nginx/html-marketing-dev:ro
      - /opt/nglu-app-dev/avelomi-site/dist:/usr/share/nginx/html-avelomi-dev:ro
      - /opt/nglu-app-dev/farmos-app/dist:/usr/share/nginx/html-farmos-dev:ro
      - /opt/nglu-app-dev/batipro-app/dist:/usr/share/nginx/html-batipro-dev:ro
      - /opt/nglu-app-dev/hr-app/dist:/usr/share/nginx/html-hr-dev:ro
      - /opt/nglu-app-dev/comptabilite-app/dist:/usr/share/nginx/html-comptabilite-dev:ro
      - /opt/nglu-app-dev/domus-app/dist:/usr/share/nginx/html-domus-dev:ro
      - /opt/nglu-app-dev/journal-app/dist:/usr/share/nginx/html-journal-dev:ro
      - /opt/nglu-app-dev/migration-app/dist:/usr/share/nginx/html-migration-dev:ro
      - /opt/nglu-app-dev/tickets-app/dist:/usr/share/nginx/html-tickets-dev:ro
      - /opt/nglu-app-dev/chat-app/dist:/usr/share/nginx/html-chat-dev:ro
    depends_on:
      - middleware
    networks:
      - nglu_prod_network
      - nglu_shared
    mem_limit: 48m

# No named volumes — certbot uses bind mount /var/www/certbot

volumes:
  nglu_prod_minio_data:
    name: nglu_prod_minio_data

networks:
  nglu_prod_network:
    name: nglu_prod_network
    driver: bridge
  nglu_shared:
    external: true
