# Dev environment stack
# Deployed to /opt/nglu-app-dev/ on the same Lightsail server as prod
# Launch: docker compose -p nglu_dev -f docker-compose.dev.yml --env-file .env.dev up -d
# NOTE: No frontend nginx here. The prod nginx (nglu_prod_frontend) serves
#       this stack's frontend/dist and marketing-site/dist via bind mounts,
#       then routes /api/ to nglu_dev_middleware.

services:
  mysql:
    image: mysql:8.0
    container_name: nglu_dev_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - nglu_dev_mysql_data:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --innodb-buffer-pool-size=64M
      --performance-schema=OFF
    networks:
      - nglu_dev_network
    mem_limit: 320m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nglu_dev_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - nglu_dev_network
    mem_limit: 48m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  backend2:
    build:
      context: ./backend2
      dockerfile: Dockerfile.prod
    container_name: nglu_dev_backend2
    restart: unless-stopped
    # Override the Dockerfile CMD (which runs `docker:prod` and skips
    # seeding) with `docker:dev-deployed` so the dev DB gets RBAC + demo
    # data on first boot. Both seed scripts are idempotent — they skip if
    # data is already present, so this is safe to keep across restarts.
    command: ["npm", "run", "docker:dev-deployed"]
    environment:
      NODE_ENV: development
      PORT: 8001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://dev.ongdngolu.org}
      APP_URL: ${APP_URL:-https://dev.ongdngolu.org}
      DB_WAIT_RETRIES: 40
      DB_WAIT_DELAY_MS: 1500
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_SECRET: ${REFRESH_SECRET}
      PERMISSIONS_GUARD_CACHE_TTL_MS: ${PERMISSIONS_GUARD_CACHE_TTL_MS:-0}
      FRONTEND_URL: ${FRONTEND_URL:-https://dev.ongdngolu.org/crm}
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_CHANNEL_USER_UPDATES: ${REDIS_CHANNEL_USER_UPDATES:-permissions-updates}
      REDIS_CHANNEL_DATA_UPDATES: ${REDIS_CHANNEL_DATA_UPDATES:-data-updates}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - nglu_dev_network
    mem_limit: 160m

  middleware:
    build:
      context: ./middleware
      dockerfile: Dockerfile
    container_name: nglu_dev_middleware
    restart: unless-stopped
    environment:
      PORT: 3001
      BACKEND_URL: http://backend2:8001
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - backend2
    networks:
      - nglu_dev_network
      - nglu_shared
    mem_limit: 48m

volumes:
  nglu_dev_mysql_data:
    name: nglu_dev_mysql_data

networks:
  nglu_dev_network:
    name: nglu_dev_network
  nglu_shared:
    external: true
