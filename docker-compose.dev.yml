# Dev environment stack
# Deployed to /opt/nglu-app-dev/ on the same Lightsail server as prod
# Launch: docker compose -p nglu_dev -f docker-compose.dev.yml --env-file .env.dev up -d
# NOTE: No frontend nginx here. The prod nginx (nglu_prod_frontend) serves
#       this stack's frontend/dist and marketing-site/dist via bind mounts,
#       then routes /api/ to nglu_dev_middleware.

services:
  mysql:
    image: mysql:8.0
    container_name: nglu_dev_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    volumes:
      - nglu_dev_mysql_data:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --innodb-buffer-pool-size=64M
      --performance-schema=OFF
    networks:
      - nglu_dev_network
    mem_limit: 320m
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: nglu_dev_redis
    restart: unless-stopped
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    networks:
      - nglu_dev_network
    mem_limit: 48m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:latest
    container_name: nglu_dev_minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-nglu_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-nglu_minio_password_change_me}
    volumes:
      - nglu_dev_minio_data:/data
    networks:
      - nglu_dev_network
    mem_limit: 128m

  # coturn - serveur TURN/STUN pour les appels audio du chat.
  # Indispensable sur les reseaux mobiles RDC : le NAT symetrique des operateurs
  # fait echouer une part importante des connexions WebRTC en P2P direct.
  # network_mode: host est requis (coturn alloue dynamiquement ses ports media
  # et ne fonctionne pas derriere le NAT Docker) -> pas de `networks:` ici.
  # Empreinte memoire faible (~20 Mo) : le serveur dev+prod est contraint.
  coturn:
    image: coturn/coturn:4.6-alpine
    container_name: nglu_dev_coturn
    restart: unless-stopped
    network_mode: host
    environment:
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_EXTERNAL_IP: ${TURN_EXTERNAL_IP:-}
      TURN_REALM: ${TURN_REALM:-nglu.chat}
    entrypoint: ["/bin/sh", "/opt/entrypoint.sh"]
    volumes:
      - ./docker/coturn/turnserver.conf:/etc/coturn/turnserver.conf:ro
      - ./docker/coturn/entrypoint.sh:/opt/entrypoint.sh:ro
    mem_limit: 64m

  backend2:
    build:
      context: ./backend2
      dockerfile: Dockerfile.prod
    container_name: nglu_dev_backend2
    restart: unless-stopped
    # Override the Dockerfile CMD (which runs `docker:prod` and skips
    # seeding) with `docker:dev-deployed` so the dev DB gets RBAC + demo
    # data on first boot. Both seed scripts are idempotent — they skip if
    # data is already present, so this is safe to keep across restarts.
    command: ["npm", "run", "docker:dev-deployed"]
    environment:
      NODE_ENV: development
      PORT: 8001
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE}
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://dev.ongdngolu.org}
      APP_URL: ${APP_URL:-https://dev.ongdngolu.org}
      DB_WAIT_RETRIES: 40
      DB_WAIT_DELAY_MS: 1500
      JWT_SECRET: ${JWT_SECRET}
      REFRESH_SECRET: ${REFRESH_SECRET}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      PERMISSIONS_GUARD_CACHE_TTL_MS: ${PERMISSIONS_GUARD_CACHE_TTL_MS:-0}
      FRONTEND_URL: ${FRONTEND_URL:-https://dev.ongdngolu.org/crm}
      REDIS_ENABLED: ${REDIS_ENABLED:-true}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_CHANNEL_USER_UPDATES: ${REDIS_CHANNEL_USER_UPDATES:-permissions-updates}
      REDIS_CHANNEL_DATA_UPDATES: ${REDIS_CHANNEL_DATA_UPDATES:-data-updates}
      TURN_SECRET: ${TURN_SECRET:-}
      TURN_HOST: ${TURN_HOST:-}
      TURN_PORT: ${TURN_PORT:-3478}
      TURN_TLS_PORT: ${TURN_TLS_PORT:-5349}
      TURN_REALM: ${TURN_REALM:-nglu.chat}
      TURN_CREDENTIAL_TTL: ${TURN_CREDENTIAL_TTL:-3600}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_FROM: ${TWILIO_FROM:-}
      TWILIO_MESSAGING_SERVICE_SID: ${TWILIO_MESSAGING_SERVICE_SID:-}
      SMS_GATEWAY_LOGIN: ${SMS_GATEWAY_LOGIN:-}
      SMS_GATEWAY_PASSWORD: ${SMS_GATEWAY_PASSWORD:-}
      SMS_GATEWAY_BASE_URL: ${SMS_GATEWAY_BASE_URL:-}
      RENT_REMINDERS_ENABLED: ${RENT_REMINDERS_ENABLED:-false}
      RENT_REMINDER_OVERDUE_DAYS: ${RENT_REMINDER_OVERDUE_DAYS:-15}
      RENT_REMINDER_CRON: ${RENT_REMINDER_CRON:-0 9 * * *}
      # Preavis de fin de bail : locataire et proprietaire sont prevenus ce
      # nombre de jours avant end_date, pour decider du renouvellement. Porte
      # par le meme cron que les rappels de retard (RENT_REMINDERS_ENABLED).
      LEASE_EXPIRY_NOTICE_DAYS: ${LEASE_EXPIRY_NOTICE_DAYS:-90}
      OBJECT_STORAGE_ENDPOINT: ${OBJECT_STORAGE_ENDPOINT:-http://minio:9000}
      OBJECT_STORAGE_ACCESS_KEY_ID: ${OBJECT_STORAGE_ACCESS_KEY_ID:-nglu_minio}
      OBJECT_STORAGE_SECRET_ACCESS_KEY: ${OBJECT_STORAGE_SECRET_ACCESS_KEY:-nglu_minio_password_change_me}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-nglu-files}
      OBJECT_STORAGE_REGION: ${OBJECT_STORAGE_REGION:-us-east-1}
      OBJECT_STORAGE_FORCE_PATH_STYLE: ${OBJECT_STORAGE_FORCE_PATH_STYLE:-true}
      WHATSAPP_SERVICE_URL: ${WHATSAPP_SERVICE_URL:-}
      WHATSAPP_SERVICE_SECRET: ${WHATSAPP_SERVICE_SECRET:-}
      WHATSAPP_DOMUS_MAINTENANCE_GROUP_JID: ${WHATSAPP_DOMUS_MAINTENANCE_GROUP_JID:-}
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_started
    networks:
      - nglu_dev_network
    mem_limit: 160m

  middleware:
    build:
      context: ./middleware
      dockerfile: Dockerfile
    container_name: nglu_dev_middleware
    restart: unless-stopped
    environment:
      PORT: 3001
      BACKEND_URL: http://backend2:8001
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      - backend2
    networks:
      - nglu_dev_network
      - nglu_shared
    mem_limit: 48m

volumes:
  nglu_dev_mysql_data:
    name: nglu_dev_mysql_data
  nglu_dev_minio_data:
    name: nglu_dev_minio_data

networks:
  nglu_dev_network:
    name: nglu_dev_network
  nglu_shared:
    external: true
