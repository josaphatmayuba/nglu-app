                - scp -o StrictHostKeyChecking=no -r chat-app/dist/* $SERVER:/tmp/chat-app-dist/
                - $SSH $SERVER "mkdir -p $APP/chat-app/dist && find $APP/chat-app/dist -mindepth 1 -delete && cp -r /tmp/chat-app-dist/. $APP/chat-app/dist/ && rm -rf /tmp/chat-app-dist"
                # html-chat-prod n'est pas un volume bind-monte : docker cp dans le conteneur
                - $SSH $SERVER "docker exec nglu_prod_frontend mkdir -p /usr/share/nginx/html-chat-prod && docker cp $APP/chat-app/dist/. nglu_prod_frontend:/usr/share/nginx/html-chat-prod/"
                - $SSH $SERVER "docker exec nglu_prod_frontend nginx -t && docker exec nglu_prod_frontend nginx -s reload"

          - step:
              name: Marketing → prod
              caches: [node-marketing]
              condition: { changesets: { includePaths: ["marketing-site/**"] } }
              script:
                - apk add --no-cache openssh-client
                - cd marketing-site && npm install --legacy-peer-deps && npm run build && cd ..
                - export SERVER=admin@16.54.167.125 APP=/opt/nglu-app SSH="ssh -o StrictHostKeyChecking=no"
                - $SSH $SERVER "mkdir -p $APP/marketing-site/dist"
                - scp -o StrictHostKeyChecking=no -r marketing-site/dist $SERVER:$APP/marketing-site/
                - $SSH $SERVER "docker exec nglu_prod_frontend nginx -s reload || true"

  # ═══════════ Override manuel : tout redeployer (Bitbucket → Run pipeline → custom) ═══════════
  custom:
    deploy-all-dev:
      - parallel:
          - step:
              name: Backend2 → dev (full)
              caches: [node-backend2]
              script:
                - apk add --no-cache openssh-client
                - cd backend2 && npm ci && npm run build && cd ..
                - export SERVER=admin@16.54.167.125 APP=/opt/nglu-app-dev SSH="ssh -o StrictHostKeyChecking=no"
                - $SSH $SERVER "cd $APP && (git pull origin develop || echo skip)"
                - scp -o StrictHostKeyChecking=no -r backend2/dist $SERVER:$APP/backend2/
                - scp -o StrictHostKeyChecking=no -r middleware $SERVER:$APP/
                - $SSH $SERVER "cd $APP && docker compose -p nglu_dev -f docker-compose.dev.yml --env-file .env.dev up -d --build --no-deps backend2 middleware"
          - step:
              name: Apps statiques → dev (full)
              script:
                - apk add --no-cache openssh-client
                - cd frontend && npm install --legacy-peer-deps && npm run build:dev && cd ..
                - for a in domus-app farmos-app batipro-app hr-app marketing-site; do (cd $a && npm install --legacy-peer-deps && npm run build && cd ..); done
                - cd comptabilite-app && npm install --legacy-peer-deps && npm run build:dev && cd ..
                - export SERVER=admin@16.54.167.125 APP=/opt/nglu-app-dev SSH="ssh -o StrictHostKeyChecking=no"
                - for a in frontend domus-app farmos-app batipro-app hr-app comptabilite-app marketing-site; do $SSH $SERVER "mkdir -p $APP/$a/dist"; scp -o StrictHostKeyChecking=no -r $a/dist $SERVER:$APP/$a/; done
                - $SSH $SERVER "docker exec nglu_prod_frontend nginx -s reload || true"

    deploy-all-prod:
      - parallel:
          - step:
              name: Backend2 → prod (full)
              caches: [node-backend2]
              script:
                - apk add --no-cache openssh-client
                - cd backend2 && npm ci && npm run build && cd ..
                - export SERVER=admin@16.54.167.125 APP=/opt/nglu-app SSH="ssh -o StrictHostKeyChecking=no"
                - $SSH $SERVER "cd $APP && (git pull origin master || echo skip)"
                - scp -o StrictHostKeyChecking=no -r backend2/dist $SERVER:$APP/backend2/
                - scp -o StrictHostKeyChecking=no -r middleware $SERVER:$APP/
                - $SSH $SERVER "cd $APP && docker compose -p nglu_prod -f docker-compose.prod.yml --env-file .env.prod up -d --build --no-deps backend2 middleware"
          - step:
              name: Apps statiques → prod (full)
              script:
                - apk add --no-cache openssh-client
                - cd frontend && npm install --legacy-peer-deps && npm run build:prod && cd ..
                - for a in domus-app farmos-app batipro-app hr-app marketing-site; do (cd $a && npm install --legacy-peer-deps && npm run build && cd ..); done
                - cd comptabilite-app && npm install --legacy-peer-deps && npm run build:prod && cd ..
                - export SERVER=admin@16.54.167.125 APP=/opt/nglu-app SSH="ssh -o StrictHostKeyChecking=no"
                - for a in frontend domus-app farmos-app batipro-app hr-app comptabilite-app marketing-site; do $SSH $SERVER "mkdir -p $APP/$a/dist"; scp -o StrictHostKeyChecking=no -r $a/dist $SERVER:$APP/$a/; done
                - $SSH $SERVER "docker exec nglu_prod_frontend nginx -s reload || true"
