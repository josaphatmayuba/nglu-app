                - $SSH $SERVER "docker exec nglu_prod_frontend nginx -t && docker exec nglu_prod_frontend nginx -s reload"

          - step:
              name: Migration Cockpit → prod
              caches: [node-migration]
              condition: { changesets: { includePaths: ["migration-app/**", "nginx/nginx.frontend.conf", "docker-compose.prod.yml", "bitbucket-pipelines.yml"] } }
              script:
                - apk add --no-cache openssh-client
                - cd migration-app && npm install --legacy-peer-deps && npm run build && cd ..
                - export SERVER=admin@16.54.167.125 APP=/opt/nglu-app SSH="ssh -o StrictHostKeyChecking=no"
                - $SSH $SERVER "mkdir -p $APP/migration-app/dist $APP/nginx"
                - scp -o StrictHostKeyChecking=no -r migration-app/dist $SERVER:$APP/migration-app/
                # 1) Met a jour les FICHIERS HOTE : conf nginx (:ro) + compose (volume html-migration-dev).
                - scp -o StrictHostKeyChecking=no nginx/nginx.frontend.conf $SERVER:$APP/nginx/nginx.frontend.conf
                - scp -o StrictHostKeyChecking=no docker-compose.prod.yml $SERVER:$APP/docker-compose.prod.yml
                # 2) RECREE le frontend pour qu'il re-binde la conf :ro a jour (la route /migration est
                #    nouvelle ; docker cp/cat > sont impossibles sur un mount read-only). Bref flicker.
                # Conteneur frontend = projet compose `nglu-app` (cf. step dev). On recree avec son projet
                # reel + --force-recreate, sinon conflit de nom.
                - $SSH $SERVER "cd $APP && docker compose -p nglu-app -f docker-compose.prod.yml --env-file .env.prod up -d --no-deps --force-recreate frontend"
                # 3) APRES le recreate, depose le dist prod dans le conteneur (html-migration-prod n'est pas
                #    un volume : meme schema que comptabilite/domus prod, deja bakes/cp).
                - $SSH $SERVER "docker exec nglu_prod_frontend mkdir -p /usr/share/nginx/html-migration-prod && docker cp $APP/migration-app/dist/. nglu_prod_frontend:/usr/share/nginx/html-migration-prod/"
                - $SSH $SERVER "docker exec nglu_prod_frontend nginx -t && docker exec nglu_prod_frontend nginx -s reload"

          - step:
              name: Chat → prod
              caches: [node-chat]
              condition: { changesets: { includePaths: ["chat-app/**"] } }
              script:
                - apk add --no-cache openssh-client
                - cd chat-app && npm install --legacy-peer-deps && npm run build:prod && cd ..
                - export SERVER=admin@16.54.167.125 APP=/opt/nglu-app SSH="ssh -o StrictHostKeyChecking=no"
