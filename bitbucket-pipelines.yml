                - cd avelomi-site && npm install --legacy-peer-deps && npm run build && cd ..
                - export SERVER=admin@3.128.45.29 APP=/opt/nglu-app-dev STACK_APP=/opt/nglu-app
                - export SSH="ssh -i ~/.ssh/avelomi.pem -o StrictHostKeyChecking=no"
                - export SCP="scp -i ~/.ssh/avelomi.pem -o StrictHostKeyChecking=no"
                - $SSH $SERVER "sudo mkdir -p $APP/avelomi-site/dist $STACK_APP/nginx $STACK_APP/frontend /var/www/certbot"
                - $SSH $SERVER "for static_app in frontend marketing-site avelomi-site farmos-app domus-app journal-app tickets-app batipro-app hr-app comptabilite-app migration-app chat-app; do sudo mkdir -p $APP/\$static_app/dist $STACK_APP/\$static_app/dist; if [ ! -f $STACK_APP/\$static_app/dist/index.html ]; then printf '<!doctype html><html><body>%s non deploye.</body></html>\n' \"\$static_app\" | sudo tee $STACK_APP/\$static_app/dist/index.html >/dev/null; fi; done; sudo touch $STACK_APP/.env.prod"
                - $SSH $SERVER "rm -rf /tmp/avelomi-site-dist && mkdir -p /tmp/avelomi-site-dist"
