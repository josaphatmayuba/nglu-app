image: node:20-alpine

# CI/CD multi-projets NgluApp — deploiement cible.
#   develop -> dev  (dev.ongdngolu.org, /opt/nglu-app-dev,  projet compose nglu_dev)
#   master  -> prod (ongdngolu.org,     /opt/nglu-app,      projet compose nglu_prod)
#
# Chaque projet a son propre step build+deploy, conditionne sur son dossier
# (changesets.includePaths) : seul le ou les projets reellement modifies sont
# rebuild et redeployes. Toucher domus-app/ ne redeploie QUE Domus.
#
# Override : pipelines custom "deploy-all-dev" / "deploy-all-prod" (lances a la
# main depuis Bitbucket) forcent le redeploiement complet si besoin.

definitions:
  caches:
    node-frontend: frontend/node_modules
    node-backend2: backend2/node_modules
    node-domus: domus-app/node_modules
    node-journal: journal-app/node_modules
    node-farmos: farmos-app/node_modules
    node-batipro: batipro-app/node_modules
    node-hr: hr-app/node_modules
    node-comptabilite: comptabilite-app/node_modules
    node-migration: migration-app/node_modules
    node-tickets: tickets-app/node_modules
    node-marketing: marketing-site/node_modules
    node-chat: chat-app/node_modules

pipelines:
  branches:
    # ════════════════════════════ DEVELOP → DEV ════════════════════════════
    develop:
      - parallel:
          - step:
              name: Backend2 → dev
              caches: [node-backend2]
              condition: { changesets: { includePaths: ["backend2/**", "docker-compose.dev.yml", ".env.dev"] } }
              script:
                - apk add --no-cache openssh-client
                - cd backend2 && npm ci && npm audit --audit-level=critical && npm run build && cd ..
                - export SERVER=admin@16.54.167.125 APP=/opt/nglu-app-dev SSH="ssh -o StrictHostKeyChecking=no"
                - $SSH $SERVER "cd $APP && (git pull origin develop || echo '[deploy] git pull ignore')"
                - scp -o StrictHostKeyChecking=no -r backend2/dist $SERVER:$APP/backend2/
                # Sync migrations explicitement (l'image bake drizzle/ via COPY . . ;
                # ne pas dépendre du git pull serveur qui peut échouer silencieusement).
                - scp -o StrictHostKeyChecking=no -r backend2/drizzle $SERVER:$APP/backend2/
                - $SSH $SERVER "cd $APP && docker compose -p nglu_dev -f docker-compose.dev.yml --env-file .env.dev up -d --build --no-deps backend2"
                - $SSH $SERVER "cd $APP && docker compose -p nglu_dev -f docker-compose.dev.yml ps"

          - step:
              name: PDF Service → dev
              condition: { changesets: { includePaths: ["pdf-service/**", "docker-compose.dev.yml"] } }
              script:
                - apk add --no-cache openssh-client
                - export SERVER=admin@16.54.167.125 APP=/opt/nglu-app-dev SSH="ssh -o StrictHostKeyChecking=no"
                - $SSH $SERVER "cd $APP && (git pull origin develop || echo '[deploy] git pull ignore')"
                - $SSH $SERVER "cd $APP && docker compose -p nglu_dev -f docker-compose.dev.yml --env-file .env.dev up -d --build --no-deps pdf-service"
                - $SSH $SERVER "cd $APP && docker compose -p nglu_dev -f docker-compose.dev.yml ps"

          - step:
              name: Middleware → dev
              condition: { changesets: { includePaths: ["middleware/**", "docker-compose.dev.yml"] } }
              script:
                - apk add --no-cache openssh-client
                - export SERVER=admin@16.54.167.125 APP=/opt/nglu-app-dev SSH="ssh -o StrictHostKeyChecking=no"
                - $SSH $SERVER "cd $APP && (git pull origin develop || echo '[deploy] git pull ignore')"
                - scp -o StrictHostKeyChecking=no -r middleware $SERVER:$APP/
                - $SSH $SERVER "cd $APP && docker compose -p nglu_dev -f docker-compose.dev.yml --env-file .env.dev up -d --build --no-deps middleware"
                - $SSH $SERVER "cd $APP && docker compose -p nglu_dev -f docker-compose.dev.yml ps"

          - step:
              name: Frontend → dev
              caches: [node-frontend]
              condition: { changesets: { includePaths: ["frontend/**"] } }
              script:
                - apk add --no-cache openssh-client
                - cd frontend && npm install --legacy-peer-deps && npm audit --audit-level=high && npm run build:dev && cd ..
                - export SERVER=admin@16.54.167.125 APP=/opt/nglu-app-dev SSH="ssh -o StrictHostKeyChecking=no"
                - $SSH $SERVER "rm -rf /tmp/frontend-dist && mkdir -p /tmp/frontend-dist $APP/frontend/dist"
                - scp -o StrictHostKeyChecking=no -r frontend/dist/* $SERVER:/tmp/frontend-dist/
                # Bind-mount safe: on vide le CONTENU du dist monté (inode préservé) puis on copie le nouveau contenu — éviter scp -r dist (inode orphelin → ancien build servi).
                - $SSH $SERVER "find $APP/frontend/dist -mindepth 1 -delete && cp -r /tmp/frontend-dist/. $APP/frontend/dist/ && rm -rf /tmp/frontend-dist"
                - $SSH $SERVER "docker exec nglu_prod_frontend nginx -s reload || true"

          - step:
              name: Domus → dev
              caches: [node-domus]
              condition: { changesets: { includePaths: ["domus-app/**"] } }
              script:
                - apk add --no-cache openssh-client
                - cd domus-app && npm install --legacy-peer-deps && npm run build && cd ..
                - export SERVER=admin@16.54.167.125 APP=/opt/nglu-app-dev SSH="ssh -o StrictHostKeyChecking=no"
                - $SSH $SERVER "rm -rf /tmp/domus-app-dist && mkdir -p /tmp/domus-app-dist $APP/domus-app/dist"
                - scp -o StrictHostKeyChecking=no -r domus-app/dist/* $SERVER:/tmp/domus-app-dist/
                # Bind-mount safe: on vide le CONTENU du dist monté (inode préservé) puis on copie le nouveau contenu — éviter scp -r dist (inode orphelin → ancien build servi).
                - $SSH $SERVER "find $APP/domus-app/dist -mindepth 1 -delete && cp -r /tmp/domus-app-dist/. $APP/domus-app/dist/ && rm -rf /tmp/domus-app-dist"
                - $SSH $SERVER "docker exec nglu_prod_frontend nginx -s reload || true"

          - step:
              name: Journal → dev
              caches: [node-journal]
              condition: { changesets: { includePaths: ["journal-app/**"] } }
              script:
                - apk add --no-cache openssh-client
                - cd journal-app && npm install --legacy-peer-deps && npm run build && cd ..
                - export SERVER=admin@16.54.167.125 APP=/opt/nglu-app-dev SSH="ssh -o StrictHostKeyChecking=no"
                - $SSH $SERVER "rm -rf /tmp/journal-app-dist && mkdir -p /tmp/journal-app-dist $APP/journal-app/dist"
                - scp -o StrictHostKeyChecking=no -r journal-app/dist/* $SERVER:/tmp/journal-app-dist/
                - $SSH $SERVER "find $APP/journal-app/dist -mindepth 1 -delete && cp -r /tmp/journal-app-dist/. $APP/journal-app/dist/ && rm -rf /tmp/journal-app-dist"
                - $SSH $SERVER "docker exec nglu_prod_frontend nginx -s reload || true"

          - step:
              name: Tickets → dev
              caches: [node-tickets]
              condition: { changesets: { includePaths: ["tickets-app/**"] } }
              script:
                - apk add --no-cache openssh-client
                - cd tickets-app && npm install --legacy-peer-deps && npm run build && cd ..
                - export SERVER=admin@16.54.167.125 SSH="ssh -o StrictHostKeyChecking=no"
                - $SSH $SERVER "rm -rf /tmp/tickets-app-dist && mkdir -p /tmp/tickets-app-dist"
                - scp -o StrictHostKeyChecking=no -r tickets-app/dist/* $SERVER:/tmp/tickets-app-dist/
                - $SSH $SERVER "docker exec nglu_prod_frontend sh -c 'mkdir -p /usr/share/nginx/html-tickets-dev && find /usr/share/nginx/html-tickets-dev -mindepth 1 -delete' && docker cp /tmp/tickets-app-dist/. nglu_prod_frontend:/usr/share/nginx/html-tickets-dev/ && rm -rf /tmp/tickets-app-dist"
                - $SSH $SERVER "docker exec nglu_prod_frontend nginx -t && docker exec nglu_prod_frontend nginx -s reload"

          - step:
              name: FarmOS → dev
              caches: [node-farmos]
              condition: { changesets: { includePaths: ["farmos-app/**"] } }
              script:
                - apk add --no-cache openssh-client
                - cd farmos-app && npm install --legacy-peer-deps && npm run build && cd ..
                - export SERVER=admin@16.54.167.125 APP=/opt/nglu-app-dev SSH="ssh -o StrictHostKeyChecking=no"
                - $SSH $SERVER "rm -rf /tmp/farmos-app-dist && mkdir -p /tmp/farmos-app-dist $APP/farmos-app/dist"
                - scp -o StrictHostKeyChecking=no -r farmos-app/dist/* $SERVER:/tmp/farmos-app-dist/
                # Bind-mount safe: on vide le CONTENU du dist monté (inode préservé) puis on copie le nouveau contenu — éviter scp -r dist (inode orphelin → ancien build servi).
                - $SSH $SERVER "find $APP/farmos-app/dist -mindepth 1 -delete && cp -r /tmp/farmos-app-dist/. $APP/farmos-app/dist/ && rm -rf /tmp/farmos-app-dist"
                - $SSH $SERVER "docker exec nglu_prod_frontend nginx -s reload || true"

          - step:
              name: BatiPro → dev
              caches: [node-batipro]
              condition: { changesets: { includePaths: ["batipro-app/**", "nginx/nginx.frontend.conf", "bitbucket-pipelines.yml"] } }
              script:
                - apk add --no-cache openssh-client
                - cd batipro-app && npm install --legacy-peer-deps && npm run build && cd ..
                - export SERVER=admin@16.54.167.125 APP=/opt/nglu-app-dev PROD_APP=/opt/nglu-app SSH="ssh -o StrictHostKeyChecking=no"
                - $SSH $SERVER "mkdir -p $APP/batipro-app/dist $PROD_APP/nginx"
                # html-batipro-dev bind-monte :ro depuis l'hote -> ecrire dans le dossier HOTE (docker cp
                # echoue: mounted volume read-only). Bind-mount safe: vider le contenu (inode preserve) puis copier.
                - $SSH $SERVER "rm -rf /tmp/batipro-app-dist && mkdir -p /tmp/batipro-app-dist"
                - scp -o StrictHostKeyChecking=no -r batipro-app/dist/* $SERVER:/tmp/batipro-app-dist/
                - $SSH $SERVER "find $APP/batipro-app/dist -mindepth 1 -delete && cp -r /tmp/batipro-app-dist/. $APP/batipro-app/dist/ && rm -rf /tmp/batipro-app-dist"
                - scp -o StrictHostKeyChecking=no nginx/nginx.frontend.conf $SERVER:$PROD_APP/nginx/nginx.frontend.conf
                - $SSH $SERVER "docker exec nglu_prod_frontend nginx -s reload || true"

          - step:
              name: HR → dev
              caches: [node-hr]
              condition: { changesets: { includePaths: ["hr-app/**", "nginx/nginx.frontend.conf", "bitbucket-pipelines.yml"] } }
              script:
                - apk add --no-cache openssh-client
                - cd hr-app && npm install --legacy-peer-deps && npm run build && cd ..
                - export SERVER=admin@16.54.167.125 APP=/opt/nglu-app-dev PROD_APP=/opt/nglu-app SSH="ssh -o StrictHostKeyChecking=no"
                - $SSH $SERVER "mkdir -p $APP/hr-app/dist $PROD_APP/nginx"
                # html-hr-dev est bind-monte :ro depuis $APP/hr-app/dist -> on ecrit dans le dossier HOTE
                # (docker cp vers le conteneur echoue: mounted volume read-only). Bind-mount safe: vider le
                # CONTENU (inode preserve) puis copier, sinon scp -r dist cree un inode orphelin.
                - $SSH $SERVER "rm -rf /tmp/hr-app-dist && mkdir -p /tmp/hr-app-dist"
                - scp -o StrictHostKeyChecking=no -r hr-app/dist/* $SERVER:/tmp/hr-app-dist/
                - $SSH $SERVER "find $APP/hr-app/dist -mindepth 1 -delete && cp -r /tmp/hr-app-dist/. $APP/hr-app/dist/ && rm -rf /tmp/hr-app-dist"
                - scp -o StrictHostKeyChecking=no nginx/nginx.frontend.conf $SERVER:$PROD_APP/nginx/nginx.frontend.conf
                - $SSH $SERVER "docker exec nglu_prod_frontend nginx -s reload || true"

          - step:
              name: Comptabilite → dev
              caches: [node-comptabilite]
              condition: { changesets: { includePaths: ["comptabilite-app/**", "nginx/nginx.frontend.conf", "bitbucket-pipelines.yml"] } }
              script:
                - apk add --no-cache openssh-client
                - cd comptabilite-app && npm install --legacy-peer-deps && npm run build:dev && cd ..
                - export SERVER=admin@16.54.167.125 APP=/opt/nglu-app-dev PROD_APP=/opt/nglu-app SSH="ssh -o StrictHostKeyChecking=no"
                - $SSH $SERVER "mkdir -p $APP/comptabilite-app/dist $PROD_APP/nginx"
                # html-comptabilite-dev bind-monte :ro depuis l'hote -> ecrire dans le dossier HOTE (docker
                # cp echoue: read-only). Bind-mount safe: vider le contenu (inode preserve) puis copier.
                - $SSH $SERVER "rm -rf /tmp/comptabilite-app-dist && mkdir -p /tmp/comptabilite-app-dist"
                - scp -o StrictHostKeyChecking=no -r comptabilite-app/dist/* $SERVER:/tmp/comptabilite-app-dist/
                - $SSH $SERVER "find $APP/comptabilite-app/dist -mindepth 1 -delete && cp -r /tmp/comptabilite-app-dist/. $APP/comptabilite-app/dist/ && rm -rf /tmp/comptabilite-app-dist"
                - scp -o StrictHostKeyChecking=no nginx/nginx.frontend.conf $SERVER:$PROD_APP/nginx/nginx.frontend.conf
                - $SSH $SERVER "docker exec nglu_prod_frontend nginx -s reload || true"

          - step:
              name: Migration Cockpit → dev
              caches: [node-migration]
              condition: { changesets: { includePaths: ["migration-app/**", "nginx/nginx.frontend.conf", "docker-compose.prod.yml", "bitbucket-pipelines.yml"] } }
              script:
                - apk add --no-cache openssh-client
                - cd migration-app && npm install --legacy-peer-deps && npm run build && cd ..
                - export SERVER=admin@16.54.167.125 APP=/opt/nglu-app-dev PROD_APP=/opt/nglu-app SSH="ssh -o StrictHostKeyChecking=no"
                - $SSH $SERVER "mkdir -p $APP/migration-app/dist $PROD_APP/nginx"
                # dist dev bind-monte :ro via docker-compose.prod.yml (html-migration-dev). Bind-mount safe:
                # vider le contenu (inode preserve) puis copier, sinon scp -r dist cree un inode orphelin.
                - $SSH $SERVER "rm -rf /tmp/migration-app-dist && mkdir -p /tmp/migration-app-dist"
                - scp -o StrictHostKeyChecking=no -r migration-app/dist/* $SERVER:/tmp/migration-app-dist/
                - $SSH $SERVER "find $APP/migration-app/dist -mindepth 1 -delete && cp -r /tmp/migration-app-dist/. $APP/migration-app/dist/ && rm -rf /tmp/migration-app-dist"
                # La conf nginx ET le compose (nouveau volume html-migration-dev) sont montes/lus depuis
                # l'hote : on met a jour les FICHIERS HOTE...
                - scp -o StrictHostKeyChecking=no nginx/nginx.frontend.conf $SERVER:$PROD_APP/nginx/nginx.frontend.conf
                - scp -o StrictHostKeyChecking=no docker-compose.prod.yml $SERVER:$PROD_APP/docker-compose.prod.yml
                # ...puis on RECREE le conteneur frontend (projet prod, qui sert dev+prod) pour qu'il
                # re-binde la conf :ro a jour + le nouveau volume html-migration-dev. `docker cp`/`cat >`
                # sont impossibles ici (mount read-only). Bref flicker de tous les sites front (~secondes).
                # NB: le conteneur frontend existant appartient au projet compose `nglu-app` (et non
                # `nglu_prod` comme backend2/middleware) — heritage de l'incident du 2 juin. On recree
                # avec SON projet reel, sinon conflit de nom (« container name already in use »).
                - $SSH $SERVER "cd $PROD_APP && docker compose -p nglu-app -f docker-compose.prod.yml --env-file .env.prod up -d --no-deps --force-recreate frontend"
                - $SSH $SERVER "docker exec nglu_prod_frontend nginx -t"

          - step:
              name: Chat → dev
              caches: [node-chat]
              condition: { changesets: { includePaths: ["chat-app/**", "nginx/nginx.frontend.conf", "bitbucket-pipelines.yml"] } }
              script:
                - apk add --no-cache openssh-client
                - cd chat-app && npm install --legacy-peer-deps && npm run build:dev && cd ..
                - export SERVER=admin@16.54.167.125 APP=/opt/nglu-app-dev PROD_APP=/opt/nglu-app SSH="ssh -o StrictHostKeyChecking=no"
                - $SSH $SERVER "mkdir -p $APP/chat-app/dist"
                - $SSH $SERVER "rm -rf /tmp/chat-app-dist && mkdir -p /tmp/chat-app-dist"
                - scp -o StrictHostKeyChecking=no -r chat-app/dist/* $SERVER:/tmp/chat-app-dist/
                - $SSH $SERVER "find $APP/chat-app/dist -mindepth 1 -delete && cp -r /tmp/chat-app-dist/. $APP/chat-app/dist/ && rm -rf /tmp/chat-app-dist"
                # Sync conf nginx partagée + reload frontend (dev et prod partagent la même conf nginx)
                - $SSH $SERVER "mkdir -p $PROD_APP/nginx"
                - scp -o StrictHostKeyChecking=no nginx/nginx.frontend.conf $SERVER:$PROD_APP/nginx/nginx.frontend.conf
                - $SSH $SERVER "docker exec nglu_prod_frontend nginx -s reload || true"

          - step:
              name: Marketing → dev
              caches: [node-marketing]
              condition: { changesets: { includePaths: ["marketing-site/**"] } }
              script:
                - apk add --no-cache openssh-client
                - cd marketing-site && npm install --legacy-peer-deps && npm run build && cd ..
                - export SERVER=admin@16.54.167.125 APP=/opt/nglu-app-dev SSH="ssh -o StrictHostKeyChecking=no"
                - $SSH $SERVER "mkdir -p $APP/marketing-site/dist"
                - scp -o StrictHostKeyChecking=no -r marketing-site/dist $SERVER:$APP/marketing-site/
                - $SSH $SERVER "docker exec nglu_prod_frontend nginx -s reload || true"

    # ════════════════════════════ MASTER → PROD ════════════════════════════
    # Déploiement prod AUTOMATIQUE au push/merge sur master (comme develop→dev).
    # changesets.includePaths => seuls les projets réellement modifiés sont déployés.
    master:
      - parallel:
          - step:
              name: Backend2 → prod
              caches: [node-backend2]
              condition: { changesets: { includePaths: ["backend2/**", "docker-compose.prod.yml", ".env.prod"] } }
              script:
                - apk add --no-cache openssh-client
                - cd backend2 && npm ci && npm audit --audit-level=critical && npm run build && cd ..
                - export SERVER=admin@16.54.167.125 APP=/opt/nglu-app SSH="ssh -o StrictHostKeyChecking=no"
                - $SSH $SERVER "cd $APP && (git pull origin master || echo '[deploy] git pull ignore')"
                - scp -o StrictHostKeyChecking=no -r backend2/dist $SERVER:$APP/backend2/
                # Sync migrations explicitement (l'image bake drizzle/ via COPY . . ;
                # ne pas dépendre du git pull serveur qui peut échouer silencieusement).
                - scp -o StrictHostKeyChecking=no -r backend2/drizzle $SERVER:$APP/backend2/
                - $SSH $SERVER "cd $APP && docker compose -p nglu_prod -f docker-compose.prod.yml --env-file .env.prod up -d --build --no-deps backend2"
                - $SSH $SERVER "cd $APP && docker compose -p nglu_prod -f docker-compose.prod.yml ps"

          - step:
              name: PDF Service → prod
              condition: { changesets: { includePaths: ["pdf-service/**", "docker-compose.prod.yml"] } }
              script:
                - apk add --no-cache openssh-client
                - export SERVER=admin@16.54.167.125 APP=/opt/nglu-app SSH="ssh -o StrictHostKeyChecking=no"
                - $SSH $SERVER "cd $APP && (git pull origin master || echo '[deploy] git pull ignore')"
                - $SSH $SERVER "cd $APP && docker compose -p nglu_prod -f docker-compose.prod.yml --env-file .env.prod up -d --build --no-deps pdf-service"
                - $SSH $SERVER "cd $APP && docker compose -p nglu_prod -f docker-compose.prod.yml ps"

          - step:
              name: Middleware → prod
              condition: { changesets: { includePaths: ["middleware/**", "docker-compose.prod.yml"] } }
              script:
                - apk add --no-cache openssh-client
                - export SERVER=admin@16.54.167.125 APP=/opt/nglu-app SSH="ssh -o StrictHostKeyChecking=no"
                - $SSH $SERVER "cd $APP && (git pull origin master || echo '[deploy] git pull ignore')"
                - scp -o StrictHostKeyChecking=no -r middleware $SERVER:$APP/
                - $SSH $SERVER "cd $APP && docker compose -p nglu_prod -f docker-compose.prod.yml --env-file .env.prod up -d --build --no-deps middleware"
                - $SSH $SERVER "cd $APP && docker compose -p nglu_prod -f docker-compose.prod.yml ps"

          - step:
              name: Frontend → prod
              caches: [node-frontend]
              condition: { changesets: { includePaths: ["frontend/**"] } }
              # Prod = dist bind-montee servie par nginx : on NE rebuild PAS l'image (cf. incident prod), simple reload.
              script:
                - apk add --no-cache openssh-client
                - cd frontend && npm install --legacy-peer-deps && npm audit --audit-level=high && npm run build:prod && cd ..
                - export SERVER=admin@16.54.167.125 APP=/opt/nglu-app SSH="ssh -o StrictHostKeyChecking=no"
                - $SSH $SERVER "rm -rf /tmp/frontend-dist && mkdir -p /tmp/frontend-dist $APP/frontend/dist"
                - scp -o StrictHostKeyChecking=no -r frontend/dist/* $SERVER:/tmp/frontend-dist/
                # Bind-mount safe: on vide le CONTENU du dist monté (inode préservé) puis on copie le nouveau contenu — éviter scp -r dist (inode orphelin → ancien build servi).
                - $SSH $SERVER "find $APP/frontend/dist -mindepth 1 -delete && cp -r /tmp/frontend-dist/. $APP/frontend/dist/ && rm -rf /tmp/frontend-dist"
                - $SSH $SERVER "docker exec nglu_prod_frontend nginx -s reload || true"

          - step:
              name: Domus → prod
              caches: [node-domus]
              condition: { changesets: { includePaths: ["domus-app/**"] } }
              script:
                - apk add --no-cache openssh-client
                - cd domus-app && npm install --legacy-peer-deps && npm run build && cd ..
                - export SERVER=admin@16.54.167.125 APP=/opt/nglu-app SSH="ssh -o StrictHostKeyChecking=no"
                - $SSH $SERVER "rm -rf /tmp/domus-app-dist && mkdir -p /tmp/domus-app-dist"
                - scp -o StrictHostKeyChecking=no -r domus-app/dist/* $SERVER:/tmp/domus-app-dist/
                # PROD: html-domus-prod est INTERNE au conteneur (pas bind-monté) → docker cp obligatoire ; écrire sur l'hôte ne sert RIEN. Cf hr/comptabilite.
                - $SSH $SERVER "docker exec nglu_prod_frontend sh -c 'find /usr/share/nginx/html-domus-prod -mindepth 1 -delete' && docker cp /tmp/domus-app-dist/. nglu_prod_frontend:/usr/share/nginx/html-domus-prod/ && rm -rf /tmp/domus-app-dist"
                - $SSH $SERVER "docker exec nglu_prod_frontend nginx -t && docker exec nglu_prod_frontend nginx -s reload"

          - step:
              name: Journal → prod
              caches: [node-journal]
              condition: { changesets: { includePaths: ["journal-app/**"] } }
              script:
                - apk add --no-cache openssh-client
                - cd journal-app && npm install --legacy-peer-deps && npm run build && cd ..
                - export SERVER=admin@16.54.167.125 APP=/opt/nglu-app SSH="ssh -o StrictHostKeyChecking=no"
                - $SSH $SERVER "rm -rf /tmp/journal-app-dist && mkdir -p /tmp/journal-app-dist"
                - scp -o StrictHostKeyChecking=no -r journal-app/dist/* $SERVER:/tmp/journal-app-dist/
                - $SSH $SERVER "docker exec nglu_prod_frontend sh -c 'find /usr/share/nginx/html-journal-prod -mindepth 1 -delete' && docker cp /tmp/journal-app-dist/. nglu_prod_frontend:/usr/share/nginx/html-journal-prod/ && rm -rf /tmp/journal-app-dist"
                - $SSH $SERVER "docker exec nglu_prod_frontend nginx -t && docker exec nglu_prod_frontend nginx -s reload"

          - step:
              name: Tickets → prod
              caches: [node-tickets]
              condition: { changesets: { includePaths: ["tickets-app/**"] } }
              script:
