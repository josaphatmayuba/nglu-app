                # PROD: html-farmos-prod est INTERNE au conteneur (pas bind-monté) → docker cp obligatoire ; écrire sur l'hôte ne sert RIEN. Cf hr/comptabilite.
                - $SSH $SERVER "docker exec nglu_prod_frontend sh -c 'find /usr/share/nginx/html-farmos-prod -mindepth 1 -delete' && docker cp /tmp/farmos-app-dist/. nglu_prod_frontend:/usr/share/nginx/html-farmos-prod/ && rm -rf /tmp/farmos-app-dist"
                - $SSH $SERVER "docker exec nglu_prod_frontend nginx -t && docker exec nglu_prod_frontend nginx -s reload"

          - step:
              name: BatiPro → prod
              caches: [node-batipro]
              condition: { changesets: { includePaths: ["batipro-app/**"] } }
              script:
                - apk add --no-cache openssh-client
                - cd batipro-app && npm install --legacy-peer-deps && npm run build && cd ..
                - export SERVER=admin@16.54.167.125 APP=/opt/nglu-app SSH="ssh -o StrictHostKeyChecking=no"
                - $SSH $SERVER "rm -rf /tmp/batipro-app-dist && mkdir -p /tmp/batipro-app-dist"
                - scp -o StrictHostKeyChecking=no -r batipro-app/dist/* $SERVER:/tmp/batipro-app-dist/
                # PROD: html-batipro-prod est INTERNE au conteneur (pas bind-monté) → docker cp obligatoire ; écrire sur l'hôte ne sert RIEN. Cf hr/comptabilite.
                - $SSH $SERVER "docker exec nglu_prod_frontend sh -c 'find /usr/share/nginx/html-batipro-prod -mindepth 1 -delete 2>/dev/null; mkdir -p /usr/share/nginx/html-batipro-prod' && docker cp /tmp/batipro-app-dist/. nglu_prod_frontend:/usr/share/nginx/html-batipro-prod/ && rm -rf /tmp/batipro-app-dist"
