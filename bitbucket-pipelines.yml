image: node:20-alpine

definitions:
  caches:
    node-frontend: frontend/node_modules
    node-backend2: backend2/node_modules

  steps:
    - step: &audit-security
        name: Security Audit (npm audit high/critical)
        image: node:20-alpine
        script:
          - echo "=== Backend2 audit ==="
          - cd backend2 && npm ci --ignore-scripts && npm audit --audit-level=high
          - cd ..
          - echo "=== Frontend audit ==="
          - cd frontend && npm install --legacy-peer-deps --ignore-scripts && npm audit --audit-level=high

    - step: &build-backend2
        name: Build Backend2
        image: node:20-alpine
        caches:
          - node-backend2
        script:
          - cd backend2
          - npm ci
          - npm run build
        artifacts:
          - backend2/dist/**

    - step: &build-frontend-prod
        name: Build Frontend (production mode)
        image: node:20-alpine
        caches:
          - node-frontend
        script:
          - cd frontend
          - npm install --legacy-peer-deps
          - npm run build:prod
        artifacts:
          - frontend/dist/**

    - step: &build-frontend-dev
        name: Build Frontend (development mode)
        image: node:20-alpine
        caches:
          - node-frontend
        script:
          - cd frontend
          - npm install --legacy-peer-deps
          - npm run build:dev
        artifacts:
          - frontend/dist/**

    - step: &deploy-prod
        name: Deploy to Production (ongdngolu.org)
        image: alpine
        script:
          - apk add --no-cache openssh-client
          - SERVER=admin@16.54.167.125
          - APP_DIR=/opt/nglu-app
          - ssh $SERVER "cd $APP_DIR && git pull origin master"
          - scp -r frontend/dist $SERVER:$APP_DIR/frontend/
          - scp -r backend2/dist $SERVER:$APP_DIR/backend2/
          - ssh $SERVER "cd $APP_DIR && docker compose -p nglu_prod -f docker-compose.prod.yml --env-file .env.prod up --build -d"
          - ssh $SERVER "docker compose -p nglu_prod -f $APP_DIR/docker-compose.prod.yml ps"

    - step: &deploy-dev
        name: Deploy to Development (dev.ongdngolu.org)
        image: alpine
        script:
          - apk add --no-cache openssh-client
          - SERVER=admin@16.54.167.125
          - APP_DIR=/opt/nglu-app-dev
          - ssh $SERVER "cd $APP_DIR && git pull origin develop"
          - scp -r frontend/dist $SERVER:$APP_DIR/frontend/
          - scp -r backend2/dist $SERVER:$APP_DIR/backend2/
          - ssh $SERVER "cd $APP_DIR && docker compose -p nglu_dev -f docker-compose.dev.yml --env-file .env.dev up --build -d"
          - ssh $SERVER "docker compose -p nglu_dev -f $APP_DIR/docker-compose.dev.yml ps"

pipelines:
  branches:
    master:
      - step: *audit-security
      - step: *build-backend2
      - step: *build-frontend-prod
      - step: *deploy-prod

    develop:
      - step: *audit-security
      - step: *build-backend2
      - step: *build-frontend-dev
      - step: *deploy-dev
