  # ═══════════ Override manuel : tout redeployer (Bitbucket → Run pipeline → custom) ═══════════
  custom:
    deploy-all-dev:
      - parallel:
          - step:
              name: Backend2 → dev (full)
              caches: [node-backend2]
              script:
                - apk add --no-cache openssh-client
                - cd backend2 && npm ci && npm run build && cd ..
                - export SERVER=admin@16.54.167.125 APP=/opt/nglu-app-dev SSH="ssh -o StrictHostKeyChecking=no"
                - $SSH $SERVER "cd $APP && (git pull origin develop || echo skip)"
                - scp -o StrictHostKeyChecking=no -r backend2/dist $SERVER:$APP/backend2/
                - scp -o StrictHostKeyChecking=no -r middleware $SERVER:$APP/
                - $SSH $SERVER "cd $APP && docker compose -p nglu_dev -f docker-compose.dev.yml --env-file .env.dev up -d --build --no-deps backend2 middleware"
          - step:
              name: Apps statiques → dev (full)
              script:
                - apk add --no-cache openssh-client
                - cd frontend && npm install --legacy-peer-deps && npm run build:dev && cd ..
                - for a in domus-app farmos-app batipro-app hr-app marketing-site; do (cd $a && npm install --legacy-peer-deps && npm run build && cd ..); done
                - cd comptabilite-app && npm install --legacy-peer-deps && npm run build:dev && cd ..
                - export SERVER=admin@16.54.167.125 APP=/opt/nglu-app-dev PROD_APP=/opt/nglu-app SSH="ssh -o StrictHostKeyChecking=no"
                - for a in frontend domus-app farmos-app batipro-app hr-app comptabilite-app marketing-site; do $SSH $SERVER "mkdir -p $APP/$a/dist"; scp -o StrictHostKeyChecking=no -r $a/dist $SERVER:$APP/$a/; done
                - scp -o StrictHostKeyChecking=no nginx/nginx.frontend.conf $SERVER:$PROD_APP/nginx/nginx.frontend.conf
                - scp -o StrictHostKeyChecking=no docker-compose.prod.yml $SERVER:$PROD_APP/docker-compose.prod.yml
                - $SSH $SERVER "set -e; cd $PROD_APP; FRONTEND_PROJECT=\$(docker inspect -f '{{with index .Config.Labels \"com.docker.compose.project\"}}{{.}}{{end}}' nglu_prod_frontend 2>/dev/null || true); [ -n \"\$FRONTEND_PROJECT\" ] || FRONTEND_PROJECT=nglu_prod; docker compose -p \"\$FRONTEND_PROJECT\" -f docker-compose.prod.yml --env-file .env.prod up -d --no-deps --force-recreate frontend"
                - $SSH $SERVER "docker exec nglu_prod_frontend nginx -t"
          - step:
              name: Avelomi-site → dev (full)
              caches: [node-avelomi]
              script:
                - *avelomi-ssh-setup
                - cd avelomi-site && npm install --legacy-peer-deps && npm run build && cd ..
                - export SERVER=admin@3.128.45.29 APP=/opt/nglu-app-dev STACK_APP=/opt/nglu-app
                - export SSH="ssh -i ~/.ssh/avelomi.pem -o StrictHostKeyChecking=no"
                - export SCP="scp -i ~/.ssh/avelomi.pem -o StrictHostKeyChecking=no"
                - $SSH $SERVER "sudo mkdir -p $APP/avelomi-site/dist $STACK_APP/nginx $STACK_APP/frontend /var/www/certbot"
                - $SSH $SERVER "for static_app in frontend marketing-site avelomi-site farmos-app domus-app journal-app tickets-app batipro-app hr-app comptabilite-app migration-app chat-app; do sudo mkdir -p $APP/\$static_app/dist $STACK_APP/\$static_app/dist; if [ ! -f $STACK_APP/\$static_app/dist/index.html ]; then printf '<!doctype html><html><body>%s non deploye.</body></html>\n' \"\$static_app\" | sudo tee $STACK_APP/\$static_app/dist/index.html >/dev/null; fi; done; sudo touch $STACK_APP/.env.prod"
                - $SSH $SERVER "rm -rf /tmp/avelomi-site-dist && mkdir -p /tmp/avelomi-site-dist"
                - $SCP -r avelomi-site/dist/* $SERVER:/tmp/avelomi-site-dist/
                - $SSH $SERVER "sudo find $APP/avelomi-site/dist -mindepth 1 -delete && sudo cp -r /tmp/avelomi-site-dist/. $APP/avelomi-site/dist/ && sudo chown -R \$(id -un):\$(id -gn) $APP/avelomi-site/dist && rm -rf /tmp/avelomi-site-dist"
                - $SCP nginx/nginx.avelomi-dev.conf $SERVER:/tmp/nginx.avelomi.conf
                - $SCP docker-compose.prod.yml $SERVER:/tmp/docker-compose.prod.yml
                - $SCP frontend/Dockerfile.prod $SERVER:/tmp/Dockerfile.prod
                - $SSH $SERVER "sudo install -m 0644 /tmp/nginx.avelomi.conf $STACK_APP/nginx/nginx.frontend.conf && sudo install -m 0644 /tmp/docker-compose.prod.yml $STACK_APP/docker-compose.prod.yml && sudo install -m 0644 /tmp/Dockerfile.prod $STACK_APP/frontend/Dockerfile.prod && rm -f /tmp/nginx.avelomi.conf /tmp/docker-compose.prod.yml /tmp/Dockerfile.prod"
                - $SSH $SERVER "if ! command -v docker >/dev/null 2>&1; then curl -fsSL https://get.docker.com | sudo sh; fi; sudo systemctl start docker 2>/dev/null || sudo service docker start 2>/dev/null || true; sudo docker network create nglu_shared 2>/dev/null || true"
                - $SSH $SERVER "if [ ! -f /etc/letsencrypt/live/dev.avelomi.com/fullchain.pem ]; then if ! command -v certbot >/dev/null 2>&1; then sudo apt-get update -y && sudo apt-get install -y certbot; fi; sudo certbot certonly --standalone -d dev.avelomi.com --email admin@avelomi.com --agree-tos --non-interactive; fi"
                - $SSH $SERVER "set -e; cd $STACK_APP; DOCKER=docker; docker ps >/dev/null 2>&1 || DOCKER='sudo docker'; FRONTEND_PROJECT=\$(\$DOCKER inspect -f '{{with index .Config.Labels \"com.docker.compose.project\"}}{{.}}{{end}}' nglu_prod_frontend 2>/dev/null || true); [ -n \"\$FRONTEND_PROJECT\" ] || FRONTEND_PROJECT=nglu_prod; \$DOCKER compose -p \"\$FRONTEND_PROJECT\" -f docker-compose.prod.yml --env-file .env.prod up -d --build --no-deps --force-recreate frontend"
                - $SSH $SERVER "DOCKER=docker; docker ps >/dev/null 2>&1 || DOCKER='sudo docker'; \$DOCKER exec nglu_prod_frontend nginx -t"

    deploy-all-prod:
      - parallel:
          - step:
              name: Backend2 → prod (full)
              caches: [node-backend2]
