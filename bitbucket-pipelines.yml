      # ══════════════════════ MASTER → AVELOMI (2e prod) ══════════════════════
      # Même push master, 2e serveur séparé (3.128.45.29 / avelomi.com), sa propre
      # DB et son propre .env.prod. Toutes les cibles sont surchargées via env :
      #   SERVER/BASE_URL/SSH/SCP pointent Avelomi ; le reste du flux est identique.
      # NB: bloc parallel séparé (après ongdngolu) — si Avelomi est down, seuls ses
      # steps échouent, pas le déploiement ongdngolu déjà terminé au-dessus.
      - parallel:
          - step:
              name: Backend2 → Avelomi
              caches: [node-backend2]
              # bitbucket-pipelines.yml inclus : ce step porte le provisionnement
              # Avelomi (clone repo + .env.prod + init avelomi_db). Sans ce chemin,
              # une PR ne touchant que le pipeline skippait le step -> rien provisionne.
              condition: { changesets: { includePaths: ["backend2/**", "docker-compose.prod.yml", ".env.prod", "bitbucket-pipelines.yml"] } }
              script:
                - *avelomi-ssh-setup
                - cd backend2 && npm ci && npm audit --audit-level=critical && npm run build && cd ..
                - export SERVER=admin@3.128.45.29 APP=/opt/nglu-app
