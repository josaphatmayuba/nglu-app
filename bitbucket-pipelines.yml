image: node:20-alpine

# CI/CD multi-projets NgluApp — deploiement cible.
#   develop -> dev  (dev.ongdngolu.org on ongdngolu, dev.avelomi.com on Avelomi)
#   master  -> prod (ongdngolu.org,     /opt/nglu-app,      projet compose nglu_prod)
#
# Chaque projet a son propre step build+deploy, conditionne sur son dossier
# (changesets.includePaths) : seul le ou les projets reellement modifies sont
# rebuild et redeployes. Toucher domus-app/ ne redeploie QUE Domus.
#
# Override : pipelines custom "deploy-all-dev" / "deploy-all-prod" (lances a la
# main depuis Bitbucket) forcent le redeploiement complet si besoin.

definitions:
  # ── Avelomi (2e prod, serveur séparé 3.128.45.29 / avelomi.com) ──────────────
  # Bitbucket n'a qu'UNE clé SSH CI par défaut (celle d'ongdngolu). Pour le 2e
  # hôte on charge AVELOMI_SSH_KEY si elle existe, sinon la clé SSH native
  # Bitbucket (BITBUCKET_SSH_KEY_FILE). La valeur AVELOMI_SSH_KEY peut être une
  # clé PEM brute, un PEM avec \n échappés, ou une clé encodée base64.
  yaml-anchors:
    avelomi-ssh-setup: &avelomi-ssh-setup |
      apk add --no-cache openssh-client
      mkdir -p ~/.ssh && chmod 700 ~/.ssh

      write_ssh_key_material() {
        key_material="$1"
        if printf '%s\n' "$key_material" | grep -q -- "-----BEGIN .*PRIVATE KEY-----"; then
          printf '%b\n' "$key_material" > ~/.ssh/avelomi.pem
        else
          printf '%s' "$key_material" | base64 -d > ~/.ssh/avelomi.pem || {
            echo "Avelomi SSH key is neither PEM nor valid base64." >&2
            exit 1
          }
        fi
      }

      if [ -n "${AVELOMI_SSH_KEY:-}" ]; then
        write_ssh_key_material "$AVELOMI_SSH_KEY"
      elif [ -n "${BITBUCKET_SSH_KEY_FILE:-}" ] && [ -f "$BITBUCKET_SSH_KEY_FILE" ]; then
        cp "$BITBUCKET_SSH_KEY_FILE" ~/.ssh/avelomi.pem
      elif [ -n "${SSH_PRIVATE_KEY:-}" ]; then
        write_ssh_key_material "$SSH_PRIVATE_KEY"
      else
        echo "Missing Avelomi SSH key: set AVELOMI_SSH_KEY or authorize Bitbucket's default SSH key on the Avelomi server." >&2
        exit 1
      fi

      chmod 600 ~/.ssh/avelomi.pem
      ssh-keygen -y -f ~/.ssh/avelomi.pem >/dev/null || {
        echo "Avelomi SSH key file is invalid or encrypted with a passphrase." >&2
        exit 1
      }
    # Cree /opt/nglu-app-dev/.env.dev SI ABSENT, secrets generes SUR LE SERVEUR
    # Avelomi (openssl) : ils ne transitent jamais par le repo ni le runner.
    # Idempotent : si le fichier existe deja, inchange (preserve la DB dev peuplee).
    # Suppose SERVER/SSH deja exportes par le step appelant.
    avelomi-dev-env: &avelomi-dev-env |
      $SSH $SERVER 'set -e; f=/opt/nglu-app-dev/.env.dev; if [ ! -f "$f" ]; then
        printf "DB_ROOT_PASSWORD=%s\nDB_DATABASE=nglu_dev_db\nDB_USERNAME=nglu_dev\nDB_PASSWORD=%s\nJWT_SECRET=%s\nREFRESH_SECRET=%s\nCORS_ORIGIN=https://dev.avelomi.com\nAPP_URL=https://dev.avelomi.com\nFRONTEND_URL=https://dev.avelomi.com/crm\nREDIS_ENABLED=true\n" \
          "$(openssl rand -hex 16)" "$(openssl rand -hex 16)" "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" > "$f";
        chmod 600 "$f"; echo "[deploy] .env.dev genere (secrets openssl serveur)";
      else echo "[deploy] .env.dev deja present — inchange"; fi'
    # Genere le .env.prod Avelomi sur le serveur s'il est ABSENT ou VIDE.
    # Meme principe que avelomi-dev-env : TOUS les secrets (DB_PASSWORD inclus)
    # generes par openssl SUR LE SERVEUR (jamais en CI ni dans le transcript).
    # Le DB_PASSWORD genere est aussi ecrit en clair dans un fichier dedie
    # /opt/nglu-app/.avelomi_db_password.txt (chmod 600) : le proprietaire le lit
    # en SSH pour creer l'utilisateur MySQL 'avelomi' avec CE mot de passe
    # (CREATE USER 'avelomi'@'%' IDENTIFIED BY '<contenu du fichier>'), puis
    # CREATE DATABASE avelomi_db + GRANT, sur 35.169.124.49. La base + le user
    # restent a creer a la main (compte admin MySQL requis). Suppose SERVER/SSH.
    avelomi-prod-env: &avelomi-prod-env |
      $SSH $SERVER 'set -e; f=/opt/nglu-app/.env.prod; p=/opt/nglu-app/.avelomi_db_password.txt;
        if [ ! -s "$f" ]; then
          dbpw=$(openssl rand -base64 24 | tr -d "/+=" | cut -c1-28);
          printf "APP_URL=https://avelomi.com\nCORS_ORIGIN=https://avelomi.com\nFRONTEND_URL=https://avelomi.com/crm\nDB_HOST=35.169.124.49\nDB_PORT=9306\nDB_DATABASE=avelomi_db\nDB_USERNAME=avelomi\nDB_PASSWORD=%s\nDB_ROOT_PASSWORD=\nDB_WAIT_RETRIES=30\nDB_WAIT_DELAY_MS=2000\nJWT_SECRET=%s\nREFRESH_SECRET=%s\nREDIS_ENABLED=true\nREDIS_HOST=redis\nREDIS_PORT=6379\nREDIS_CHANNEL_DATA_UPDATES=data-updates\nREDIS_CHANNEL_USER_UPDATES=user-updates\nPERMISSIONS_GUARD_CACHE_TTL_MS=60000\nRENT_REMINDERS_ENABLED=false\nVITE_API_URL=https://avelomi.com/api\nVITE_APP_API=https://avelomi.com/api\nVITE_APP_API_NODE=https://avelomi.com/api\n" \
            "$dbpw" "$(openssl rand -hex 32)" "$(openssl rand -hex 32)" > "$f";
          chmod 600 "$f";
          printf "%s\n" "$dbpw" > "$p"; chmod 600 "$p";
          echo "[deploy] .env.prod Avelomi genere (tous secrets openssl serveur).";
          echo "[deploy] DB_PASSWORD ecrit dans $p — cat ce fichier en SSH pour creer le user MySQL avelomi.";
        else echo "[deploy] .env.prod Avelomi deja rempli — inchange"; fi'
    # Clone le repo dans /opt/nglu-app si .git est absent (provision-avelomi.sh
    # n'a jamais tourne : le dossier ne contient que des fichiers deposes par CI,
    # pas de backend2/ ni scripts/ ni .git). On clone dans un dossier temp puis on
    # initialise le depot SUR PLACE (git init + remote + fetch + checkout) pour ne
    # PAS detruire les dist/ deja deposes : checkout -f ramene les sources versionnees
    # par-dessus sans toucher aux fichiers non suivis (dist generes). Idempotent :
    # si .git existe deja, on ne fait rien (le `git pull` du step suffit).
    # Suppose SERVER/SSH exportes ; le repo est public (clone via https).
    avelomi-prod-clone: &avelomi-prod-clone |
      $SSH $SERVER 'set -e; A=/opt/nglu-app;
        if [ ! -d "$A/.git" ]; then
          echo "[deploy] .git absent — initialisation du depot sur place (dist preserves)";
          sudo chown -R "$(id -un):$(id -un)" "$A";
          cd "$A";
          git init -q;
          git remote add origin https://bitbucket.org/ngolu-ong-gestion/nglu-app.git 2>/dev/null || git remote set-url origin https://bitbucket.org/ngolu-ong-gestion/nglu-app.git;
          git fetch -q --depth 1 origin master;
          git checkout -f -B master origin/master;
          echo "[deploy] depot initialise sur master ($(git rev-parse --short HEAD))";
        else echo "[deploy] .git deja present — clone ignore"; fi'
    # Cree la base avelomi_db + l'utilisateur MySQL 'avelomi' sur le serveur DB
    # distant (35.169.124.49:9306), DEPUIS le serveur Avelomi (seul a joindre la
    # DB ; le runner CI n'a pas la route reseau). Utilise un compte ADMIN MySQL
    # fourni en variables Bitbucket SECURISEES AVELOMI_DB_ADMIN_USER /
    # AVELOMI_DB_ADMIN_PASS (jamais en clair dans le repo). Le mot de passe de
    # l'user 'avelomi' est lu depuis /opt/nglu-app/.avelomi_db_password.txt
    # (genere par &avelomi-prod-env). Client mysql = conteneur jetable mysql:8.0.
    # Idempotent (CREATE ... IF NOT EXISTS + ALTER USER pour aligner le mdp).
    # Skip propre si l'admin n'est pas configure. Suppose SERVER/SSH exportes et
    # AVELOMI_DB_ADMIN_USER/PASS transmis au $SSH via l'environnement du step.
    avelomi-prod-db-init: &avelomi-prod-db-init |
      if [ -z "${AVELOMI_DB_ADMIN_USER:-}" ] || [ -z "${AVELOMI_DB_ADMIN_PASS:-}" ]; then
        echo "[deploy] AVELOMI_DB_ADMIN_USER/PASS non definis — init DB ignore (cree avelomi_db a la main)."
      else
        $SSH $SERVER "AU='$AVELOMI_DB_ADMIN_USER' AP='$AVELOMI_DB_ADMIN_PASS' bash -s" <<'DBINIT'
      set -e
      P=/opt/nglu-app/.avelomi_db_password.txt
      [ -s "$P" ] || { echo "[deploy] .avelomi_db_password.txt absent — lance d'abord le step env."; exit 0; }
      DBPW="$(cat "$P")"
      SQL="CREATE DATABASE IF NOT EXISTS avelomi_db CHARACTER SET utf8mb4 COLLATE utf8mb4_0900_ai_ci;
      CREATE USER IF NOT EXISTS 'avelomi'@'%' IDENTIFIED BY '$DBPW';
      ALTER USER 'avelomi'@'%' IDENTIFIED BY '$DBPW';
      GRANT ALL PRIVILEGES ON avelomi_db.* TO 'avelomi'@'%';
      FLUSH PRIVILEGES;"
      echo "$SQL" | sudo docker run --rm -i mysql:8.0 mysql -h 35.169.124.49 -P 9306 -u "$AU" -p"$AP"
      echo "[deploy] avelomi_db + user 'avelomi' crees/alignes (idempotent)."
      DBINIT
      fi
    # Garde prod Avelomi : skip propre tant que la base n'est pas joignable.
    # .env.prod est desormais auto-rempli (DB_PASSWORD genere), mais la base
    # avelomi_db + le user 'avelomi' doivent exister cote MySQL. On verifie une
    # connexion DB reelle ; si elle echoue, on SKIP (le backend crasherait sinon).
    avelomi-prod-guard: &avelomi-prod-guard |
      if ! $SSH $SERVER 'set -e; test -s /opt/nglu-app/.env.prod;
        pw="$(cat /opt/nglu-app/.avelomi_db_password.txt 2>/dev/null)";
        [ -n "$pw" ] || exit 1;
        sudo docker run --rm mysql:8.0 mysql -h 35.169.124.49 -P 9306 -u avelomi -p"$pw" -e "USE avelomi_db; SELECT 1;" >/dev/null 2>&1'; then
        echo "[deploy] Avelomi prod pas pret : .env.prod vide, ou avelomi_db/user injoignable."
        echo "[deploy] Verifie le firewall DB (port 9306 ouvert a 3.128.45.29) et que le step"
        echo "[deploy] db-init a cree avelomi_db (AVELOMI_DB_ADMIN_USER/PASS definis ?). Step ignore."
        exit 0
      fi
  caches:
    node-frontend: frontend/node_modules
    node-backend2: backend2/node_modules
    node-domus: domus-app/node_modules
    node-journal: journal-app/node_modules
    node-farmos: farmos-app/node_modules
    node-batipro: batipro-app/node_modules
    node-hr: hr-app/node_modules
    node-comptabilite: comptabilite-app/node_modules
    node-migration: migration-app/node_modules
    node-tickets: tickets-app/node_modules
    node-marketing: marketing-site/node_modules
    node-avelomi: avelomi-site/node_modules
    node-chat: chat-app/node_modules

pipelines:
  branches:
    # ════════════════════════════ DEVELOP → DEV ════════════════════════════
    develop:
      - parallel:
          - step:
              name: Backend2 → dev
              caches: [node-backend2]
              condition: { changesets: { includePaths: ["backend2/**", "docker-compose.dev.yml", ".env.dev"] } }
              script:
                - apk add --no-cache openssh-client
                - cd backend2 && npm ci && npm audit --audit-level=critical && npm run build && cd ..
                - export SERVER=admin@16.54.167.125 APP=/opt/nglu-app-dev SSH="ssh -o StrictHostKeyChecking=no"
                - $SSH $SERVER "cd $APP && (git pull origin develop || echo '[deploy] git pull ignore')"
                - scp -o StrictHostKeyChecking=no -r backend2/dist $SERVER:$APP/backend2/
                # Sync package.json AVANT le --build : le Dockerfile fait COPY package*.json + npm ci.
                # Sans ce scp, l'image se reconstruit avec un package.json serveur obsolete et toute
                # nouvelle dependance (ex: @nestjs/websockets) manque dans le conteneur -> MODULE_NOT_FOUND.
                - scp -o StrictHostKeyChecking=no backend2/package.json backend2/package-lock.json $SERVER:$APP/backend2/
                # Sync migrations explicitement (l'image bake drizzle/ via COPY . . ;
                # ne pas dépendre du git pull serveur qui peut échouer silencieusement).
                - scp -o StrictHostKeyChecking=no -r backend2/drizzle $SERVER:$APP/backend2/
                - $SSH $SERVER "cd $APP && docker compose -p nglu_dev -f docker-compose.dev.yml --env-file .env.dev up -d --build --no-deps backend2"
                - $SSH $SERVER "cd $APP && docker compose -p nglu_dev -f docker-compose.dev.yml ps"

          - step:
              name: PDF Service → dev
              condition: { changesets: { includePaths: ["pdf-service/**", "docker-compose.dev.yml"] } }
              script:
                - apk add --no-cache openssh-client
                - export SERVER=admin@16.54.167.125 APP=/opt/nglu-app-dev SSH="ssh -o StrictHostKeyChecking=no"
                - scp -o StrictHostKeyChecking=no -r pdf-service $SERVER:$APP/
                - $SSH $SERVER "cd $APP && docker compose -p nglu_dev -f docker-compose.dev.yml --env-file .env.dev up -d --build --no-deps pdf-service"
                - $SSH $SERVER "cd $APP && docker compose -p nglu_dev -f docker-compose.dev.yml ps"

          - step:
              name: Middleware → dev
              condition: { changesets: { includePaths: ["middleware/**", "docker-compose.dev.yml"] } }
              script:
                - apk add --no-cache openssh-client
                - export SERVER=admin@16.54.167.125 APP=/opt/nglu-app-dev SSH="ssh -o StrictHostKeyChecking=no"
                - $SSH $SERVER "cd $APP && (git pull origin develop || echo '[deploy] git pull ignore')"
                - scp -o StrictHostKeyChecking=no -r middleware $SERVER:$APP/
                - $SSH $SERVER "cd $APP && docker compose -p nglu_dev -f docker-compose.dev.yml --env-file .env.dev up -d --build --no-deps middleware"
                - $SSH $SERVER "cd $APP && docker compose -p nglu_dev -f docker-compose.dev.yml ps"

          - step:
              name: Frontend → dev
              caches: [node-frontend]
              condition: { changesets: { includePaths: ["frontend/**"] } }
              script:
                - apk add --no-cache openssh-client
                # npm audit en mode informatif (|| true) : ne PAS bloquer le build sur une vuln
                # transitive de dev/build (ex: undici high, non embarque dans le bundle navigateur),
                # sinon le && coupe la chaine et npm run build:dev ne tourne jamais -> dist/ vide -> scp echoue.
                - cd frontend && npm install --legacy-peer-deps && (npm audit --audit-level=high || true) && npm run build:dev && cd ..
                - export SERVER=admin@16.54.167.125 APP=/opt/nglu-app-dev SSH="ssh -o StrictHostKeyChecking=no"
                - $SSH $SERVER "rm -rf /tmp/frontend-dist && mkdir -p /tmp/frontend-dist $APP/frontend/dist"
                - scp -o StrictHostKeyChecking=no -r frontend/dist/* $SERVER:/tmp/frontend-dist/
                # Bind-mount safe: on vide le CONTENU du dist monté (inode préservé) puis on copie le nouveau contenu — éviter scp -r dist (inode orphelin → ancien build servi).
                - $SSH $SERVER "find $APP/frontend/dist -mindepth 1 -delete && cp -r /tmp/frontend-dist/. $APP/frontend/dist/ && rm -rf /tmp/frontend-dist"
                - $SSH $SERVER "docker exec nglu_prod_frontend nginx -s reload || true"

          - step:
              name: Domus → dev
              caches: [node-domus]
              condition: { changesets: { includePaths: ["domus-app/**"] } }
              script:
                - apk add --no-cache openssh-client
                - cd domus-app && npm install --legacy-peer-deps && npm run build && cd ..
                - export SERVER=admin@16.54.167.125 APP=/opt/nglu-app-dev SSH="ssh -o StrictHostKeyChecking=no"
                - $SSH $SERVER "rm -rf /tmp/domus-app-dist && mkdir -p /tmp/domus-app-dist $APP/domus-app/dist"
                - scp -o StrictHostKeyChecking=no -r domus-app/dist/* $SERVER:/tmp/domus-app-dist/
                # Bind-mount safe: on vide le CONTENU du dist monté (inode préservé) puis on copie le nouveau contenu — éviter scp -r dist (inode orphelin → ancien build servi).
                - $SSH $SERVER "find $APP/domus-app/dist -mindepth 1 -delete && cp -r /tmp/domus-app-dist/. $APP/domus-app/dist/ && rm -rf /tmp/domus-app-dist"
                - $SSH $SERVER "docker exec nglu_prod_frontend nginx -s reload || true"

          - step:
              name: Journal → dev
              caches: [node-journal]
              condition: { changesets: { includePaths: ["journal-app/**"] } }
              script:
                - apk add --no-cache openssh-client
                - cd journal-app && npm install --legacy-peer-deps && npm run build && cd ..
                - export SERVER=admin@16.54.167.125 APP=/opt/nglu-app-dev SSH="ssh -o StrictHostKeyChecking=no"
                - $SSH $SERVER "rm -rf /tmp/journal-app-dist && mkdir -p /tmp/journal-app-dist $APP/journal-app/dist"
                - scp -o StrictHostKeyChecking=no -r journal-app/dist/* $SERVER:/tmp/journal-app-dist/
                - $SSH $SERVER "find $APP/journal-app/dist -mindepth 1 -delete && cp -r /tmp/journal-app-dist/. $APP/journal-app/dist/ && rm -rf /tmp/journal-app-dist"
                - $SSH $SERVER "docker exec nglu_prod_frontend nginx -s reload || true"

          - step:
              name: Tickets → dev
              caches: [node-tickets]
              condition: { changesets: { includePaths: ["tickets-app/**"] } }
              script:
                - apk add --no-cache openssh-client
                - cd tickets-app && npm install --legacy-peer-deps && npm run build && cd ..
                - export SERVER=admin@16.54.167.125 SSH="ssh -o StrictHostKeyChecking=no"
                - $SSH $SERVER "rm -rf /tmp/tickets-app-dist && mkdir -p /tmp/tickets-app-dist"
                - scp -o StrictHostKeyChecking=no -r tickets-app/dist/* $SERVER:/tmp/tickets-app-dist/
                - $SSH $SERVER "docker exec nglu_prod_frontend sh -c 'mkdir -p /usr/share/nginx/html-tickets-dev && find /usr/share/nginx/html-tickets-dev -mindepth 1 -delete' && docker cp /tmp/tickets-app-dist/. nglu_prod_frontend:/usr/share/nginx/html-tickets-dev/ && rm -rf /tmp/tickets-app-dist"
                - $SSH $SERVER "docker exec nglu_prod_frontend nginx -t && docker exec nglu_prod_frontend nginx -s reload"

          - step:
              name: FarmOS → dev
              caches: [node-farmos]
              condition: { changesets: { includePaths: ["farmos-app/**"] } }
              script:
                - apk add --no-cache openssh-client
                - cd farmos-app && npm install --legacy-peer-deps && npm run build && cd ..
                - export SERVER=admin@16.54.167.125 APP=/opt/nglu-app-dev SSH="ssh -o StrictHostKeyChecking=no"
                - $SSH $SERVER "rm -rf /tmp/farmos-app-dist && mkdir -p /tmp/farmos-app-dist $APP/farmos-app/dist"
                - scp -o StrictHostKeyChecking=no -r farmos-app/dist/* $SERVER:/tmp/farmos-app-dist/
                # Bind-mount safe: on vide le CONTENU du dist monté (inode préservé) puis on copie le nouveau contenu — éviter scp -r dist (inode orphelin → ancien build servi).
                - $SSH $SERVER "find $APP/farmos-app/dist -mindepth 1 -delete && cp -r /tmp/farmos-app-dist/. $APP/farmos-app/dist/ && rm -rf /tmp/farmos-app-dist"
                - $SSH $SERVER "docker exec nglu_prod_frontend nginx -s reload || true"

          - step:
              name: BatiPro → dev
              caches: [node-batipro]
              condition: { changesets: { includePaths: ["batipro-app/**", "nginx/nginx.frontend.conf", "bitbucket-pipelines.yml"] } }
              script:
                - apk add --no-cache openssh-client
                - cd batipro-app && npm install --legacy-peer-deps && npm run build && cd ..
                - export SERVER=admin@16.54.167.125 APP=/opt/nglu-app-dev PROD_APP=/opt/nglu-app SSH="ssh -o StrictHostKeyChecking=no"
                - $SSH $SERVER "mkdir -p $APP/batipro-app/dist $PROD_APP/nginx"
                # html-batipro-dev bind-monte :ro depuis l'hote -> ecrire dans le dossier HOTE (docker cp
                # echoue: mounted volume read-only). Bind-mount safe: vider le contenu (inode preserve) puis copier.
                - $SSH $SERVER "rm -rf /tmp/batipro-app-dist && mkdir -p /tmp/batipro-app-dist"
                - scp -o StrictHostKeyChecking=no -r batipro-app/dist/* $SERVER:/tmp/batipro-app-dist/
                - $SSH $SERVER "find $APP/batipro-app/dist -mindepth 1 -delete && cp -r /tmp/batipro-app-dist/. $APP/batipro-app/dist/ && rm -rf /tmp/batipro-app-dist"
                - scp -o StrictHostKeyChecking=no nginx/nginx.frontend.conf $SERVER:$PROD_APP/nginx/nginx.frontend.conf
                - $SSH $SERVER "docker exec nglu_prod_frontend nginx -s reload || true"

          - step:
              name: HR → dev
              caches: [node-hr]
              condition: { changesets: { includePaths: ["hr-app/**", "nginx/nginx.frontend.conf", "bitbucket-pipelines.yml"] } }
              script:
                - apk add --no-cache openssh-client
                - cd hr-app && npm install --legacy-peer-deps && npm run build && cd ..
                - export SERVER=admin@16.54.167.125 APP=/opt/nglu-app-dev PROD_APP=/opt/nglu-app SSH="ssh -o StrictHostKeyChecking=no"
                - $SSH $SERVER "mkdir -p $APP/hr-app/dist $PROD_APP/nginx"
                # html-hr-dev est bind-monte :ro depuis $APP/hr-app/dist -> on ecrit dans le dossier HOTE
                # (docker cp vers le conteneur echoue: mounted volume read-only). Bind-mount safe: vider le
                # CONTENU (inode preserve) puis copier, sinon scp -r dist cree un inode orphelin.
                - $SSH $SERVER "rm -rf /tmp/hr-app-dist && mkdir -p /tmp/hr-app-dist"
                - scp -o StrictHostKeyChecking=no -r hr-app/dist/* $SERVER:/tmp/hr-app-dist/
                - $SSH $SERVER "find $APP/hr-app/dist -mindepth 1 -delete && cp -r /tmp/hr-app-dist/. $APP/hr-app/dist/ && rm -rf /tmp/hr-app-dist"
                - scp -o StrictHostKeyChecking=no nginx/nginx.frontend.conf $SERVER:$PROD_APP/nginx/nginx.frontend.conf
                - $SSH $SERVER "docker exec nglu_prod_frontend nginx -s reload || true"

          - step:
              name: Comptabilite → dev
              caches: [node-comptabilite]
              condition: { changesets: { includePaths: ["comptabilite-app/**", "nginx/nginx.frontend.conf", "bitbucket-pipelines.yml"] } }
              script:
                - apk add --no-cache openssh-client
                - cd comptabilite-app && npm install --legacy-peer-deps && npm run build:dev && cd ..
                - export SERVER=admin@16.54.167.125 APP=/opt/nglu-app-dev PROD_APP=/opt/nglu-app SSH="ssh -o StrictHostKeyChecking=no"
                - $SSH $SERVER "mkdir -p $APP/comptabilite-app/dist $PROD_APP/nginx"
                # html-comptabilite-dev bind-monte :ro depuis l'hote -> ecrire dans le dossier HOTE (docker
                # cp echoue: read-only). Bind-mount safe: vider le contenu (inode preserve) puis copier.
                - $SSH $SERVER "rm -rf /tmp/comptabilite-app-dist && mkdir -p /tmp/comptabilite-app-dist"
                - scp -o StrictHostKeyChecking=no -r comptabilite-app/dist/* $SERVER:/tmp/comptabilite-app-dist/
                - $SSH $SERVER "find $APP/comptabilite-app/dist -mindepth 1 -delete && cp -r /tmp/comptabilite-app-dist/. $APP/comptabilite-app/dist/ && rm -rf /tmp/comptabilite-app-dist"
                - scp -o StrictHostKeyChecking=no nginx/nginx.frontend.conf $SERVER:$PROD_APP/nginx/nginx.frontend.conf
                - $SSH $SERVER "docker exec nglu_prod_frontend nginx -s reload || true"

          - step:
              name: Migration Cockpit → dev
              caches: [node-migration]
              condition: { changesets: { includePaths: ["migration-app/**", "nginx/nginx.frontend.conf", "docker-compose.prod.yml", "bitbucket-pipelines.yml"] } }
              script:
                - apk add --no-cache openssh-client
                - cd migration-app && npm install --legacy-peer-deps && npm run build && cd ..
                - export SERVER=admin@16.54.167.125 APP=/opt/nglu-app-dev PROD_APP=/opt/nglu-app SSH="ssh -o StrictHostKeyChecking=no"
                - $SSH $SERVER "mkdir -p $APP/migration-app/dist $PROD_APP/nginx"
                # dist dev bind-monte :ro via docker-compose.prod.yml (html-migration-dev). Bind-mount safe:
                # vider le contenu (inode preserve) puis copier, sinon scp -r dist cree un inode orphelin.
                - $SSH $SERVER "rm -rf /tmp/migration-app-dist && mkdir -p /tmp/migration-app-dist"
                - scp -o StrictHostKeyChecking=no -r migration-app/dist/* $SERVER:/tmp/migration-app-dist/
                - $SSH $SERVER "find $APP/migration-app/dist -mindepth 1 -delete && cp -r /tmp/migration-app-dist/. $APP/migration-app/dist/ && rm -rf /tmp/migration-app-dist"
                # La conf nginx ET le compose (nouveau volume html-migration-dev) sont montes/lus depuis
                # l'hote : on met a jour les FICHIERS HOTE...
                - scp -o StrictHostKeyChecking=no nginx/nginx.frontend.conf $SERVER:$PROD_APP/nginx/nginx.frontend.conf
                - scp -o StrictHostKeyChecking=no docker-compose.prod.yml $SERVER:$PROD_APP/docker-compose.prod.yml
                # ...puis on RECREE le conteneur frontend (projet prod, qui sert dev+prod) pour qu'il
                # re-binde la conf :ro a jour + le nouveau volume html-migration-dev. `docker cp`/`cat >`
                # sont impossibles ici (mount read-only). Bref flicker de tous les sites front (~secondes).
                # NB: le projet compose reel du conteneur frontend a change au fil des deploys.
                # On inspecte son label avant de recreer, sinon Docker refuse avec
                # "container name already in use" quand le projet hardcode ne correspond pas.
                - $SSH $SERVER "set -e; cd $PROD_APP; FRONTEND_PROJECT=\$(docker inspect -f '{{with index .Config.Labels \"com.docker.compose.project\"}}{{.}}{{end}}' nglu_prod_frontend 2>/dev/null || true); [ -n \"\$FRONTEND_PROJECT\" ] || FRONTEND_PROJECT=nglu_prod; docker compose -p \"\$FRONTEND_PROJECT\" -f docker-compose.prod.yml --env-file .env.prod up -d --no-deps --force-recreate frontend"
                - $SSH $SERVER "docker exec nglu_prod_frontend nginx -t"

          - step:
              name: Chat → dev
              caches: [node-chat]
              condition: { changesets: { includePaths: ["chat-app/**", "nginx/nginx.frontend.conf", "bitbucket-pipelines.yml"] } }
              script:
