services:
  stalwart:
    image: stalwartlabs/stalwart:v0.16
    container_name: stalwart-mail
    restart: unless-stopped
    env_file:
      - .env
    environment:
      STALWART_PUBLIC_URL: ${STALWART_PUBLIC_URL:-https://mail.ongdngolu.org}
      STALWART_RECOVERY_ADMIN: ${STALWART_RECOVERY_ADMIN}
    ports:
      # Admin/setup listener: localhost-only by default. Put HTTPS/VPN/reverse proxy in front if remote access is required.
      - "${STALWART_ADMIN_BIND:-127.0.0.1}:${STALWART_ADMIN_PORT:-8088}:8080"
      # Mail protocols.
      - "25:25"
      - "465:465"
      - "587:587"
      - "993:993"
    volumes:
      - stalwart_etc:/etc/stalwart
      - stalwart_data:/var/lib/stalwart

volumes:
  stalwart_etc:
  stalwart_data:
